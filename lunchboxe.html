<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Lunch Boxe — World of Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Raleway:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#111820;--bg3:#162030;--panel:#182030;--panel2:#1e2a3a;--panel3:#243040;
  --border:#2a3d55;--border2:#3a5070;
  --green:#00c030;--green2:#00e040;--green3:#80f0a0;--greenglow:rgba(0,192,48,0.3);--greendim:#00802a;
  --teal:#00b4a0;--tealbright:#00d4bc;--red:#e0303a;--redbright:#ff4050;
  --amber:#e0a000;--amberbright:#ffc020;--blue:#2060c0;--bluebright:#3080f0;
  --purple:#8040d0;--purplebright:#a060f0;--orange:#d05000;--orangebright:#f07020;
  --text:#c8dde8;--text2:#7a9ab0;--text3:#405870;--white:#e8f4f8;--shadow:rgba(0,0,0,0.7);
}
html,body{background:var(--bg);color:var(--text);font-family:'Libre Baskerville',serif;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;}
.screen{display:none;width:100%;height:100vh;overflow:hidden;}
.screen.active{display:flex;flex-direction:column;}

/* TITLE */
#screenTitle{background:radial-gradient(ellipse 120% 80% at 50% 20%,rgba(0,80,30,0.5) 0%,transparent 55%),radial-gradient(ellipse 60% 60% at 80% 80%,rgba(0,30,60,0.4) 0%,transparent 55%),linear-gradient(180deg,#090e12 0%,#0d1117 100%);align-items:center;justify-content:center;position:relative;overflow:hidden;}
.title-scanlines{position:absolute;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);}
.title-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,192,48,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,192,48,0.04) 1px,transparent 1px);background-size:40px 40px;}
.title-frame{position:relative;z-index:2;background:rgba(24,32,48,0.95);border:1px solid var(--border2);padding:2.5rem 2.5rem 3rem;max-width:360px;width:90%;text-align:center;box-shadow:0 0 80px rgba(0,0,0,0.8),0 0 40px rgba(0,192,48,0.08),inset 0 1px 0 rgba(255,255,255,0.05);}
.title-frame::before{content:'';position:absolute;inset:0;border:1px solid rgba(0,192,48,0.15);pointer-events:none;}
.title-corner{position:absolute;width:20px;height:20px;border-color:var(--green);border-style:solid;}
.title-corner.tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.title-corner.tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}
.title-corner.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}
.title-corner.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
.title-crest{font-size:4rem;display:block;margin-bottom:0.8rem;filter:drop-shadow(0 0 20px rgba(0,192,48,0.6));animation:crestFloat 4s ease-in-out infinite;}
@keyframes crestFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title-main{font-family:'Raleway',sans-serif;font-weight:900;font-size:clamp(2rem,8vw,3rem);color:var(--white);letter-spacing:-0.02em;line-height:1;margin-bottom:0.2rem;}
.title-main span{color:var(--green);}
.title-sub{font-family:'Raleway',sans-serif;font-size:0.62rem;letter-spacing:0.35em;color:var(--text3);text-transform:uppercase;margin-bottom:0.6rem;}
.title-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:0.8rem 0;}
.title-tagline{font-size:0.82rem;color:var(--text2);font-style:italic;margin-bottom:1.8rem;}
.title-name-input{width:100%;background:rgba(0,0,0,0.4);border:1px solid var(--border2);border-bottom:2px solid var(--green);color:var(--white);font-family:'Libre Baskerville',serif;font-size:0.95rem;padding:0.7rem 1rem;margin-bottom:0.8rem;outline:none;text-align:center;transition:all 0.2s;}
.title-name-input:focus{border-color:var(--green);box-shadow:0 0 0 1px rgba(0,192,48,0.2);}
.title-name-input::placeholder{color:var(--text3);}
.btn-title{width:100%;background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-size:0.88rem;font-weight:700;letter-spacing:0.12em;padding:0.85rem;cursor:pointer;position:relative;overflow:hidden;transition:all 0.15s;text-transform:uppercase;margin-bottom:0.5rem;}
.btn-title::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 100%);}
.btn-title:hover{background:var(--green2);}
.btn-title:active{transform:scale(0.98);}
.btn-title.secondary{background:transparent;border:1px solid var(--border2);color:var(--text3);font-size:0.72rem;font-weight:400;padding:0.55rem;letter-spacing:0.08em;}
.btn-title.secondary:hover{border-color:var(--green);color:var(--green);}
.title-disclaimer{font-size:0.6rem;color:var(--text3);margin-top:1rem;font-style:italic;}

/* NARRATOR */
.narrator-overlay{position:fixed;bottom:0;left:0;right:0;z-index:500;display:flex;align-items:flex-end;pointer-events:none;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);transform:translateY(110%);}
.narrator-overlay.show{transform:translateY(0);pointer-events:all;}
.narrator-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(2px);}
.narrator-box{position:relative;z-index:1;width:100%;background:linear-gradient(180deg,#0d1822 0%,#0a1218 100%);border-top:2px solid var(--border2);display:flex;align-items:flex-end;gap:0;min-height:130px;box-shadow:0 -8px 32px rgba(0,0,0,0.7);}
.narrator-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:0.4;}
.narrator-portrait{width:90px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 0 0.5rem;position:relative;}
.char-sprite{width:80px;height:80px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 12px rgba(0,192,48,0.3));animation:charBob 2.5s ease-in-out infinite;position:relative;z-index:1;}
.char-sprite img{width:72px;height:72px;object-fit:contain;display:block;}
.char-sprite .emoji-fallback{font-size:3.8rem;line-height:1;}
@keyframes charBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.char-sprite.villain{filter:drop-shadow(0 0 14px rgba(255,60,0,0.5));animation-duration:1.8s;}
.char-name-tag{background:var(--panel2);border:1px solid var(--border2);font-family:'Raleway',sans-serif;font-size:0.5rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 8px;margin-bottom:4px;color:var(--white);width:100%;text-align:center;}
.char-name-tag.fraise{border-color:#e04070;color:#ff80a0;}
.char-name-tag.poire{border-color:#80c020;color:#c0f040;}
.char-name-tag.banane{border-color:#e0a000;color:#ffd040;}
.char-name-tag.narrateur{border-color:var(--border2);color:var(--text2);}
.narrator-content{flex:1;padding:0.8rem 1rem;display:flex;flex-direction:column;gap:0.4rem;justify-content:center;}
.narrator-text{font-size:0.82rem;color:var(--white);line-height:1.6;font-family:'Libre Baskerville',serif;min-height:2.5rem;}
.narrator-cursor{display:inline-block;width:2px;height:0.9em;background:var(--green);margin-left:2px;animation:cursorBlink 0.7s step-end infinite;vertical-align:middle;}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
.narrator-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.3rem;}
.narrator-tap-hint{font-family:'Raleway',sans-serif;font-size:0.48rem;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;}
.btn-narrator-next{background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:'Raleway',sans-serif;font-size:0.6rem;font-weight:600;padding:0.3rem 0.8rem;cursor:pointer;letter-spacing:0.06em;text-transform:uppercase;transition:all 0.1s;-webkit-tap-highlight-color:transparent;}
.btn-narrator-next:hover{border-color:var(--green);color:var(--green);}
.btn-narrator-skip{background:transparent;border:none;color:var(--text3);font-family:'Raleway',sans-serif;font-size:0.52rem;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:underline;text-underline-offset:3px;}
.narrator-dots{display:flex;gap:4px;align-items:center;}
.ndot{width:5px;height:5px;border-radius:50%;background:var(--border2);transition:background 0.2s;}
.ndot.active{background:var(--green);}
.ndot.done{background:var(--greendim);}

/* ═══ MAIN GAME ═══ */
#screenGame{background:radial-gradient(ellipse 100% 50% at 50% 0%,rgba(0,50,20,0.15) 0%,transparent 50%),var(--bg);flex-direction:column;position:relative;}
.topbar{background:linear-gradient(180deg,#0f1820 0%,#0d1520 100%);border-bottom:1px solid var(--border);padding:0 0.8rem;display:flex;align-items:center;gap:0.6rem;flex-shrink:0;z-index:20;height:44px;}
.topbar-logo{font-family:'Raleway',sans-serif;font-weight:900;font-size:0.95rem;color:var(--white);white-space:nowrap;letter-spacing:-0.01em;}
.topbar-logo span{color:var(--green);}
.topbar-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.topbar-skills{display:flex;gap:0.25rem;align-items:center;overflow-x:auto;flex:1;scrollbar-width:none;}
.topbar-skills::-webkit-scrollbar{display:none;}
.skill-chip{display:flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--border);padding:0.18rem 0.45rem;white-space:nowrap;cursor:pointer;transition:border-color 0.15s;flex-shrink:0;}
.skill-chip:hover{border-color:var(--green);}
.skill-chip-icon{font-size:0.65rem;}
.skill-chip-val{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--green);}
.topbar-right{display:flex;align-items:center;gap:0.4rem;}
.topbar-gold{display:flex;align-items:center;gap:0.3rem;font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--amberbright);background:var(--panel2);border:1px solid var(--border);padding:0.18rem 0.55rem;}

/* Sidebar toggle button - visible on small screens */
.sidebar-toggle{display:none;background:transparent;border:1px solid var(--border);color:var(--text2);font-size:0.7rem;padding:0.18rem 0.5rem;cursor:pointer;font-family:'Raleway',sans-serif;-webkit-tap-highlight-color:transparent;}
@media (max-width:899px){.sidebar-toggle{display:flex;align-items:center;gap:4px;}}

.vitals-bar{background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);padding:0.25rem 0.8rem;display:flex;align-items:center;gap:0.6rem;flex-shrink:0;height:30px;}
.vital{display:flex;align-items:center;gap:0.3rem;flex:1;}
.vital-icon{font-size:0.65rem;}
.vital-track{flex:1;height:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.5);position:relative;overflow:hidden;}
.vital-fill{height:100%;transition:width 0.3s ease;}
.vital-fill.hp{background:linear-gradient(90deg,#5a0a0a,#c02030,#e04050);}
.vital-fill.hunger{background:linear-gradient(90deg,#4a3000,#c08000,#e0c000);}
.vital-fill.xp{background:linear-gradient(90deg,#004a1a,#00a030,var(--green));}
.vital-val{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--text2);width:36px;text-align:right;flex-shrink:0;}
.vital-label{font-family:'Raleway',sans-serif;font-size:0.48rem;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase;width:22px;flex-shrink:0;}

.game-body{flex:1;display:flex;overflow:hidden;min-height:0;position:relative;}
.content-area{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0;}
.tab-panel{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.tab-panel::-webkit-scrollbar{width:3px;}
.tab-panel::-webkit-scrollbar-thumb{background:var(--border);}
.tab-panel.active{display:flex;flex-direction:column;}

/* SIDEBAR - hidden on small screens, shown on large */
.sidebar{width:180px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--panel);overflow:hidden;transition:transform 0.3s,width 0.3s;}
@media (max-width:899px){
  .sidebar{position:absolute;right:0;top:0;bottom:0;z-index:50;transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
}
.minimap-wrap{padding:0.5rem;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.3);flex-shrink:0;}
.minimap{width:100%;aspect-ratio:1;background:radial-gradient(ellipse 60% 50% at 35% 40%,rgba(0,30,15,0.9) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 70% 65%,rgba(0,15,30,0.9) 0%,transparent 55%),#080f08;border:1px solid var(--border);position:relative;overflow:hidden;}
.minimap-dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:all 0.2s;}
.minimap-dot.current{animation:minimapPulse 1.5s ease-in-out infinite;}
@keyframes minimapPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.5)}}
.minimap-label{font-family:'Raleway',sans-serif;font-size:0.45rem;color:var(--text3);text-align:center;margin-top:0.3rem;letter-spacing:0.12em;text-transform:uppercase;}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:0.4rem;}
.skill-entry{background:var(--panel2);border:1px solid var(--border);padding:0.3rem 0.4rem;cursor:pointer;transition:border-color 0.15s;}
.skill-entry:hover{border-color:var(--green);}
.skill-entry-top{display:flex;align-items:center;justify-content:space-between;}
.skill-icon{font-size:0.8rem;}
.skill-name{font-family:'Raleway',sans-serif;font-size:0.42rem;letter-spacing:0.04em;color:var(--text3);text-transform:uppercase;}
.skill-level{font-family:'DM Mono',monospace;font-size:0.8rem;color:var(--green);font-weight:500;}
.skill-xp-track{width:100%;height:2px;background:rgba(255,255,255,0.04);margin-top:2px;}
.skill-xp-fill{height:100%;background:var(--green);transition:width 0.4s;}

.chat-log{height:72px;flex-shrink:0;background:rgba(0,0,0,0.5);border-top:1px solid var(--border);overflow-y:auto;padding:0.35rem 0.6rem;scrollbar-width:none;}
.chat-log::-webkit-scrollbar{display:none;}
.chat-line{font-family:'Libre Baskerville',serif;font-size:0.7rem;line-height:1.5;}
.chat-line.combat{color:var(--amberbright);}
.chat-line.damage{color:var(--redbright);}
.chat-line.heal{color:var(--green2);}
.chat-line.loot{color:var(--green3);}
.chat-line.skill{color:var(--tealbright);}
.chat-line.quest{color:var(--bluebright);}
.chat-line.sys{color:var(--text3);font-style:italic;}
.chat-line.special{color:var(--orangebright);font-weight:700;}
.chat-line.story{color:#ff80a0;font-style:italic;}

/* TAB BAR - responsive */
.tab-bar{background:linear-gradient(180deg,#0f1820,#0d1520);border-top:1px solid var(--border);display:flex;flex-shrink:0;z-index:15;overflow-x:auto;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex:1;min-width:44px;padding:0.4rem 0.15rem;border:none;background:none;color:var(--text3);font-family:'Raleway',sans-serif;font-size:0.42rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;cursor:pointer;border-right:1px solid var(--border);border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all 0.15s;-webkit-tap-highlight-color:transparent;position:relative;white-space:nowrap;}
.tab-btn:last-child{border-right:none;}
.tab-btn.active{color:var(--green);border-top-color:var(--green);background:rgba(0,192,48,0.06);}
.tab-btn .t-icon{font-size:0.95rem;}
@media (max-width:899px){
  .tab-btn{font-size:0.38rem;padding:0.35rem 0.1rem;}
  .tab-btn .t-icon{font-size:0.85rem;}
}
.tab-notif{position:absolute;top:4px;right:calc(50% - 14px);width:5px;height:5px;background:var(--red);border-radius:50%;animation:blink 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* WORLD */
.map-region{position:absolute;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
.map-region:active{transform:translate(-50%,-50%) scale(0.9);}
.map-region.locked{opacity:0.25;cursor:not-allowed;filter:grayscale(1);}
.region-bubble{background:rgba(0,0,0,0.7);border:1px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.6);}
.map-region:not(.locked):hover .region-bubble{border-color:var(--green);box-shadow:0 0 16px var(--greenglow),0 2px 8px rgba(0,0,0,0.6);}
.map-region.active .region-bubble{border-color:var(--green2);box-shadow:0 0 20px var(--greenglow);animation:regionPulse 2s ease-in-out infinite;}
@keyframes regionPulse{0%,100%{box-shadow:0 0 10px var(--greenglow)}50%{box-shadow:0 0 24px rgba(0,192,48,0.55)}}
.region-emoji{font-size:1.4rem;display:block;}
.region-label{font-family:'Raleway',sans-serif;font-size:0.5rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--text2);margin-top:3px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.9);}
.map-region.active .region-label{color:var(--green);}
.region-level{font-family:'DM Mono',monospace;font-size:0.45rem;color:var(--text3);}
.map-event-popup{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border2);padding:0.8rem 1.1rem;min-width:200px;max-width:290px;z-index:10;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.6);}
.map-event-popup::before{content:'';position:absolute;inset:0;border:1px solid rgba(0,192,48,0.1);pointer-events:none;}
.popup-title{font-family:'Raleway',sans-serif;font-weight:700;font-size:0.88rem;color:var(--white);margin-bottom:0.3rem;}
.popup-desc{font-size:0.7rem;color:var(--text2);line-height:1.5;margin-bottom:0.8rem;font-style:italic;}
.btn-popup{background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-size:0.7rem;font-weight:700;padding:0.45rem 1.3rem;cursor:pointer;transition:all 0.1s;display:inline-block;margin:0 0.2rem;-webkit-tap-highlight-color:transparent;letter-spacing:0.06em;text-transform:uppercase;}
.btn-popup:hover{background:var(--green2);}
.btn-popup:active{transform:scale(0.95);}
.btn-popup.secondary{background:transparent;border:1px solid var(--border2);color:var(--text3);}
.btn-popup.secondary:hover{border-color:var(--green);color:var(--green);}

/* FARM */
.farm-panel{padding:0.6rem;}
.farm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:0.6rem;}
.plot-rs{aspect-ratio:1;position:relative;cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.plot-rs:active{transform:scale(0.9);}
.plot-rs.empty{background:repeating-linear-gradient(45deg,#0a0f08 0px,#0a0f08 4px,#080d06 4px,#080d06 8px);border:1px dashed #1e2e1a;}
.plot-rs.growing{background:#0a120a;border:1px solid #1a2e1a;}
.plot-rs.ready{background:#0a1a0a;border:1px solid var(--green);box-shadow:0 0 10px rgba(0,192,48,0.2);animation:plotReady 1.5s ease-in-out infinite;}
@keyframes plotReady{0%,100%{box-shadow:0 0 5px rgba(0,192,48,0.15)}50%{box-shadow:0 0 18px rgba(0,192,48,0.4)}}
.plot-rs.locked{background:#080d06;border:1px solid #141e12;opacity:0.3;cursor:not-allowed;}
.plot-emoji{font-size:1.5rem;line-height:1;}
.plot-progress{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.04);}
.plot-progress-fill{height:100%;background:var(--green);transition:width 0.5s;}
.plot-ready-tag{position:absolute;top:2px;right:2px;background:var(--green);color:#060e08;font-family:'Raleway',sans-serif;font-size:0.4rem;font-weight:700;padding:1px 3px;letter-spacing:0.05em;text-transform:uppercase;}
.plot-time{font-size:0.45rem;color:var(--text3);font-family:'DM Mono',monospace;}
.seeds-section{background:var(--panel2);border:1px solid var(--border);padding:0.5rem;}
.seeds-title{font-family:'Raleway',sans-serif;font-size:0.58rem;color:var(--green);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.4rem;font-weight:700;}
.seeds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.seed-btn{background:var(--panel3);border:1px solid var(--border);padding:0.35rem 0.25rem;cursor:pointer;text-align:center;transition:all 0.12s;-webkit-tap-highlight-color:transparent;}
.seed-btn:active{transform:scale(0.93);}
.seed-btn.selected{border-color:var(--green);background:rgba(0,192,48,0.08);}
.seed-btn.locked{opacity:0.25;cursor:not-allowed;}
.seed-emoji{font-size:1.2rem;display:block;}
.seed-name{font-family:'Raleway',sans-serif;font-size:0.43rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;}
.seed-cost{font-family:'DM Mono',monospace;font-size:0.52rem;color:var(--amberbright);}
.seed-time{font-size:0.4rem;color:var(--text3);}

/* COOKING */
.recipes-panel{padding:0.6rem;}
.recipe-card-rs{background:var(--panel2);border:1px solid var(--border);margin-bottom:0.5rem;overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.recipe-card-rs:hover{border-color:var(--green);}
.recipe-card-rs:active{transform:scale(0.98);}
.recipe-card-rs.locked{opacity:0.3;cursor:not-allowed;}
.recipe-header{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.7rem;}
.recipe-emoji-big{font-size:2rem;}
.recipe-info-col{flex:1;}
.recipe-name-rs{font-family:'Raleway',sans-serif;font-weight:700;font-size:0.8rem;color:var(--white);}
.recipe-desc-rs{font-size:0.63rem;color:var(--text2);font-style:italic;margin-top:1px;line-height:1.4;}
.recipe-lvl-req{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--green);}
.recipe-ingredients{padding:0.35rem 0.7rem;border-top:1px solid var(--border);display:flex;gap:0.3rem;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.ing-chip{display:flex;align-items:center;gap:0.2rem;background:var(--panel3);border:1px solid var(--border);padding:0.12rem 0.35rem;font-size:0.58rem;font-family:'Raleway',sans-serif;}
.ing-chip.have{border-color:var(--green);color:var(--green2);}
.ing-chip.missing{color:var(--text3);}
.btn-cook-rs{background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-size:0.65rem;font-weight:700;padding:0.35rem 0.9rem;cursor:pointer;transition:all 0.1s;-webkit-tap-highlight-color:transparent;text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0;}
.btn-cook-rs:hover{background:var(--green2);}
.btn-cook-rs:active{transform:scale(0.95);}
.btn-cook-rs:disabled{background:var(--panel3);border:1px solid var(--border);color:var(--text3);cursor:not-allowed;}

/* COMBAT */
.combat-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse 100% 50% at 50% 0%,rgba(80,10,10,0.25) 0%,transparent 55%),var(--bg);}
.combat-arena{flex:1;display:flex;align-items:flex-end;justify-content:space-between;padding:0.5rem 1rem 0.3rem;position:relative;overflow:hidden;min-height:0;}
.arena-bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,10,10,0.15) 0%,transparent 40%),repeating-linear-gradient(90deg,transparent 0px,transparent 80px,rgba(0,192,48,0.015) 80px,rgba(0,192,48,0.015) 81px);}
.arena-floor{position:absolute;bottom:0;left:0;right:0;height:25%;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.4));border-top:1px solid rgba(0,192,48,0.04);}
.combatant{display:flex;flex-direction:column;align-items:center;z-index:2;}
.combatant-sprite{font-size:clamp(2.5rem,10vw,4.5rem);filter:drop-shadow(0 4px 12px rgba(0,0,0,0.8));animation:combatFloat 3s ease-in-out infinite;display:block;line-height:1;}
.combatant-sprite.player{animation-direction:reverse;animation-duration:2.5s;}
@keyframes combatFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.combatant-sprite.hit{animation:combatHit 0.3s forwards;}
.combatant-sprite.attacking{animation:combatAttack 0.25s ease-out forwards;}
@keyframes combatHit{0%{transform:translateX(0)}25%{transform:translateX(-14px) rotate(-8deg)}60%{transform:translateX(8px)}100%{transform:translateX(0)}}
@keyframes combatAttack{0%{transform:translateX(0)}50%{transform:translateX(20px)}100%{transform:translateX(0)}}
.combatant-shadow{width:38px;height:4px;background:rgba(0,0,0,0.5);border-radius:50%;filter:blur(3px);margin-top:1px;}
.combatant-name{font-family:'Raleway',sans-serif;font-size:0.52rem;color:var(--text2);margin-top:3px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;}
.combat-vs{font-family:'Raleway',sans-serif;font-size:1.1rem;font-weight:900;color:rgba(0,192,48,0.1);z-index:1;align-self:center;letter-spacing:0.1em;}
.combat-bars{padding:0.4rem 0.7rem;display:flex;flex-direction:column;gap:0.3rem;flex-shrink:0;background:rgba(0,0,0,0.25);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.cbar-row{display:flex;align-items:center;gap:0.4rem;}
.cbar-label{font-family:'Raleway',sans-serif;font-size:0.48rem;color:var(--text3);width:80px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.04em;}
.cbar-track{flex:1;height:10px;border:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.6);position:relative;overflow:hidden;}
.cbar-fill{height:100%;transition:width 0.35s ease;position:relative;}
.cbar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:35%;background:rgba(255,255,255,0.1);}
.cbar-fill.enemy-hp{background:linear-gradient(90deg,#5a0505,#b02020);}
.cbar-fill.player-hp{background:linear-gradient(90deg,#054010,#008030,var(--green));}
.cbar-fill.rage{background:linear-gradient(90deg,#4a2000,#c06000,var(--amberbright));}
.cbar-val{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--text2);width:55px;text-align:right;flex-shrink:0;}
.status-row{padding:0.25rem 0.7rem;display:flex;gap:0.3rem;flex-wrap:wrap;min-height:1.5rem;align-items:center;flex-shrink:0;}
.status-pill{padding:0.1rem 0.4rem;font-family:'Raleway',sans-serif;font-size:0.45rem;font-weight:600;letter-spacing:0.06em;border:1px solid;}
.status-pill.buff{background:rgba(0,192,48,0.1);border-color:var(--green);color:var(--green);}
.status-pill.debuff{background:rgba(224,48,58,0.1);border-color:var(--red);color:var(--red);}
.status-pill.burn{background:rgba(208,80,0,0.1);border-color:var(--orange);color:var(--orangebright);}
.status-pill.poison{background:rgba(0,192,48,0.08);border-color:var(--teal);color:var(--tealbright);}
.status-pill.stun{background:rgba(32,96,192,0.1);border-color:var(--blue);color:var(--bluebright);}
.combat-actions{background:var(--panel);border-top:1px solid var(--border);padding:0.4rem;flex-shrink:0;}
.combat-action-title{font-family:'Raleway',sans-serif;font-size:0.48rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.3rem;text-align:center;}
.combat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.25rem;margin-bottom:0.25rem;}
.combat-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text2);padding:0.4rem 0.15rem;font-family:'Raleway',sans-serif;font-size:0.5rem;font-weight:600;letter-spacing:0.03em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all 0.12s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;text-transform:uppercase;}
.combat-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.04) 0%,transparent 50%);}
.combat-btn:active:not(:disabled){transform:scale(0.92);}
.combat-btn:disabled{opacity:0.2;cursor:not-allowed;}
.combat-btn .cb-emoji{font-size:1rem;}
.combat-btn .cb-cost{font-size:0.4rem;color:var(--text3);}
.combat-btn.strike{border-color:#3a3000;color:var(--amberbright);}
.combat-btn.strike:hover:not(:disabled){border-color:var(--amberbright);background:rgba(224,160,0,0.06);}
.combat-btn.magic{border-color:#2a0a4a;color:var(--purplebright);}
.combat-btn.magic:hover:not(:disabled){border-color:var(--purplebright);background:rgba(128,64,208,0.06);}
.combat-btn.special{border-color:#3a1000;color:var(--orangebright);animation:specialGlow 2s ease-in-out infinite;}
@keyframes specialGlow{0%,100%{box-shadow:0 0 4px rgba(208,80,0,0.15)}50%{box-shadow:0 0 10px rgba(208,80,0,0.4)}}
.combat-btn.defend{border-color:#0a2a0a;color:var(--green);}
.combat-btn.defend:hover:not(:disabled){border-color:var(--green);}
.combat-btn.pray{border-color:#0a1a2a;color:var(--tealbright);}
.combat-btn.eat{border-color:#2a1a0a;color:var(--amberbright);}
.combat-btn.flee{border-color:#2a0a0a;color:var(--red);}
.combat-actions-row2{display:grid;grid-template-columns:1fr 1fr;gap:0.25rem;}
.monster-card{background:var(--panel2);border:1px solid var(--border);padding:0.6rem 0.8rem;margin-bottom:0.4rem;display:flex;align-items:center;gap:0.7rem;cursor:pointer;transition:border-color 0.15s;-webkit-tap-highlight-color:transparent;}
.monster-card:hover{border-color:var(--green);}
.monster-card:active{transform:scale(0.98);}

/* QUESTS */
.quests-panel{padding:0.6rem;}
.quest-card{background:var(--panel2);border:1px solid var(--border);margin-bottom:0.4rem;overflow:hidden;}
.quest-header{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.6rem;}
.quest-icon{font-size:1.4rem;}
.quest-info{flex:1;}
.quest-name{font-family:'Raleway',sans-serif;font-weight:700;font-size:0.75rem;color:var(--green);text-transform:uppercase;letter-spacing:0.05em;}
.quest-desc{font-size:0.63rem;color:var(--text2);line-height:1.4;margin-top:2px;font-style:italic;}
.quest-status{font-family:'DM Mono',monospace;font-size:0.58rem;padding:0.12rem 0.4rem;}
.quest-status.active{background:rgba(32,96,192,0.15);color:var(--bluebright);border:1px solid var(--blue);}
.quest-status.complete{background:rgba(0,192,48,0.12);color:var(--green2);border:1px solid var(--green);}
.quest-status.locked{background:rgba(20,30,20,0.5);color:var(--text3);border:1px solid var(--border);}
.quest-progress{padding:0.3rem 0.6rem;border-top:1px solid var(--border);}
.quest-task{display:flex;align-items:center;gap:0.3rem;font-size:0.62rem;margin-bottom:2px;}
.quest-task.done{color:var(--green2);}
.quest-task.todo{color:var(--text3);}

/* SHOP */
.shop-panel{padding:0.6rem;}
.shop-tabs{display:flex;gap:1px;margin-bottom:0.5rem;overflow-x:auto;scrollbar-width:none;}
.shop-tabs::-webkit-scrollbar{display:none;}
.shop-tab{flex:1;min-width:60px;padding:0.35rem;background:var(--panel2);border:1px solid var(--border);font-family:'Raleway',sans-serif;font-size:0.52rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;text-align:center;transition:all 0.1s;white-space:nowrap;}
.shop-tab.active{border-color:var(--green);color:var(--green);background:rgba(0,192,48,0.07);}
.shop-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.shop-item-card{background:var(--panel2);border:1px solid var(--border);padding:0.55rem;cursor:pointer;transition:border-color 0.15s;position:relative;-webkit-tap-highlight-color:transparent;}
.shop-item-card:hover{border-color:var(--green);}
.shop-item-card:active{transform:scale(0.95);}
.shop-item-card.owned{border-color:var(--green);}
.shop-item-card.owned::after{content:'✓';position:absolute;top:4px;right:6px;font-size:0.65rem;color:var(--green);}
.shop-item-card.cant-afford{opacity:0.35;cursor:not-allowed;}
.shop-item-emoji{font-size:1.7rem;display:block;margin-bottom:0.2rem;}
.shop-item-name{font-family:'Raleway',sans-serif;font-weight:700;font-size:0.68rem;color:var(--white);}
.shop-item-desc{font-size:0.56rem;color:var(--text3);margin-top:1px;line-height:1.4;}
.shop-item-price{display:flex;align-items:center;gap:0.25rem;margin-top:0.4rem;font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--amberbright);}

/* ═══ LOOTBOX ═══ */
.lootbox-grid{display:grid;grid-template-columns:1fr;gap:0.5rem;}
.lootbox-card{background:var(--panel2);border:1px solid var(--border2);padding:0.8rem;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.lootbox-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.02) 0%,transparent 60%);}
.lootbox-card:active{transform:scale(0.97);}
.lootbox-card.lb-common{border-color:#2a5040;}
.lootbox-card.lb-common:hover{border-color:var(--teal);box-shadow:0 0 16px rgba(0,180,160,0.15);}
.lootbox-card.lb-rare{border-color:#3a2060;}
.lootbox-card.lb-rare:hover{border-color:var(--purplebright);box-shadow:0 0 16px rgba(128,64,208,0.2);}
.lootbox-card.lb-legendary{border-color:#603010;}
.lootbox-card.lb-legendary:hover{border-color:var(--orangebright);box-shadow:0 0 20px rgba(208,80,0,0.25);}
.lootbox-card.cant-afford{opacity:0.4;cursor:not-allowed;}
.lootbox-header{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.5rem;}
.lootbox-emoji-wrap{position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lootbox-emoji-big{font-size:2.6rem;display:block;animation:lbFloat 3s ease-in-out infinite;}
@keyframes lbFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.lootbox-rarity-badge{position:absolute;bottom:-2px;right:-2px;font-family:'Raleway',sans-serif;font-size:0.38rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:1px 4px;}
.lb-badge-common{background:rgba(0,180,160,0.2);color:var(--tealbright);border:1px solid var(--teal);}
.lb-badge-rare{background:rgba(128,64,208,0.2);color:var(--purplebright);border:1px solid var(--purple);}
.lb-badge-legendary{background:rgba(208,80,0,0.2);color:var(--orangebright);border:1px solid var(--orange);}
.lootbox-info{flex:1;}
.lootbox-name{font-family:'Raleway',sans-serif;font-weight:700;font-size:0.88rem;color:var(--white);}
.lootbox-desc{font-size:0.62rem;color:var(--text2);font-style:italic;line-height:1.4;margin-top:2px;}
.lootbox-contents{font-size:0.6rem;color:var(--text3);margin-top:3px;font-family:'DM Mono',monospace;}
.lootbox-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:0.45rem;margin-top:0.45rem;}
.lootbox-price{font-family:'DM Mono',monospace;font-size:0.85rem;color:var(--amberbright);display:flex;align-items:center;gap:0.25rem;}
.btn-open-lb{background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-size:0.68rem;font-weight:700;padding:0.4rem 1.1rem;cursor:pointer;text-transform:uppercase;letter-spacing:0.08em;-webkit-tap-highlight-color:transparent;transition:all 0.1s;}
.btn-open-lb:hover{background:var(--green2);}
.btn-open-lb:active{transform:scale(0.95);}
.lb-badge-legendary + .btn-open-lb{background:var(--orange);}
.lb-badge-legendary + .btn-open-lb:hover{background:var(--orangebright);}

/* LOOTBOX OPENING OVERLAY */
.lb-opening-overlay{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.lb-opening-overlay.show{opacity:1;pointer-events:all;}
.lb-box-anim{font-size:5rem;display:block;margin-bottom:1rem;animation:lbShake 0.5s ease-in-out 0s 3;}
@keyframes lbShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(12deg) scale(1.1)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
.lb-opening-title{font-family:'Raleway',sans-serif;font-weight:900;font-size:1.4rem;color:var(--white);margin-bottom:0.3rem;letter-spacing:-0.01em;}
.lb-opening-sub{font-size:0.75rem;color:var(--text2);font-style:italic;margin-bottom:1.5rem;}
.lb-rewards-grid{display:flex;flex-direction:column;gap:0.5rem;width:100%;max-width:320px;padding:0 1.5rem;}
.lb-reward-item{display:flex;align-items:center;gap:0.8rem;background:var(--panel2);border:1px solid var(--border2);padding:0.6rem 0.8rem;animation:rewardReveal 0.4s ease-out both;}
@keyframes rewardReveal{0%{opacity:0;transform:translateX(-20px)}100%{opacity:1;transform:translateX(0)}}
.lb-reward-emoji{font-size:1.8rem;flex-shrink:0;}
.lb-reward-info{flex:1;}
.lb-reward-name{font-family:'Raleway',sans-serif;font-weight:700;font-size:0.78rem;color:var(--white);}
.lb-reward-qty{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--green);}
.lb-reward-rarity{font-family:'Raleway',sans-serif;font-size:0.48rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:1px 5px;}
.lb-rarity-common{background:rgba(0,180,160,0.15);color:var(--tealbright);border:1px solid var(--teal);}
.lb-rarity-rare{background:rgba(128,64,208,0.15);color:var(--purplebright);border:1px solid var(--purple);}
.lb-rarity-legendary{background:rgba(208,80,0,0.15);color:var(--orangebright);border:1px solid var(--orange);}
.btn-lb-collect{background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.8rem 2.5rem;cursor:pointer;margin-top:1.5rem;transition:all 0.1s;-webkit-tap-highlight-color:transparent;}
.btn-lb-collect:hover{background:var(--green2);}
.btn-lb-collect:active{transform:scale(0.96);}

/* INVENTORY */
.inv-panel{padding:0.6rem;}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.inv-slot{aspect-ratio:1;background:var(--panel2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.15s;position:relative;overflow:hidden;}
.inv-slot:hover:not(.empty){border-color:var(--green);}
.inv-slot:active:not(.empty){transform:scale(0.9);}
.inv-slot.empty{border-style:dashed;border-color:#141e14;cursor:default;}
.inv-slot-emoji{font-size:1.3rem;}
.inv-slot-qty{position:absolute;bottom:1px;right:3px;font-family:'DM Mono',monospace;font-size:0.52rem;color:var(--green);}
.inv-slot-name{font-size:0.4rem;color:var(--text3);font-family:'Raleway',sans-serif;margin-top:1px;text-align:center;}

/* DAMAGE FLOATS */
.dmg-float{position:fixed;pointer-events:none;z-index:999;font-family:'Raleway',sans-serif;font-weight:900;animation:floatUp 0.9s ease-out forwards;}
.dmg-float.enemy-dmg{color:var(--amberbright);font-size:1.5rem;text-shadow:0 0 10px rgba(224,160,0,0.5);}
.dmg-float.player-dmg{color:var(--redbright);font-size:1.3rem;}
.dmg-float.crit-dmg{color:white;font-size:1.9rem;text-shadow:0 0 20px rgba(0,192,48,0.8);}
.dmg-float.heal-dmg{color:var(--green2);font-size:1.2rem;}
.dmg-float.loot{color:var(--green3);font-size:1.1rem;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}60%{opacity:1;transform:translateY(-48px) scale(1.2)}100%{opacity:0;transform:translateY(-85px) scale(0.8)}}

/* TOAST */
.toast{position:fixed;top:55px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--panel);border:1px solid var(--border2);padding:0.5rem 1.1rem;font-family:'Raleway',sans-serif;font-size:0.7rem;font-weight:600;letter-spacing:0.06em;pointer-events:none;opacity:0;transition:all 0.25s;z-index:2000;white-space:nowrap;max-width:90vw;color:var(--white);box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.good{border-color:var(--green);color:var(--green2);}
.toast.bad{border-color:var(--red);color:var(--redbright);}
.toast.level{border-color:var(--teal);color:var(--tealbright);background:rgba(0,20,20,0.95);}
.toast.loot{border-color:var(--green2);color:var(--green3);}

/* LEVEL UP */
.levelup-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.levelup-overlay.show{opacity:1;pointer-events:all;}
.levelup-box{background:var(--panel);border:1px solid var(--green);padding:2rem 2.5rem;text-align:center;box-shadow:0 0 60px rgba(0,192,48,0.2);animation:levelupEntry 0.45s cubic-bezier(0.175,0.885,0.32,1.275);max-width:300px;width:90%;position:relative;}
.levelup-box::before{content:'';position:absolute;inset:4px;border:1px solid rgba(0,192,48,0.15);pointer-events:none;}
@keyframes levelupEntry{0%{transform:scale(0.4) rotate(-8deg);opacity:0}100%{transform:scale(1);opacity:1}}
.lu-skill-icon{font-size:3.5rem;display:block;margin-bottom:0.4rem;}
.lu-title{font-family:'Raleway',sans-serif;font-weight:900;font-size:1.6rem;color:var(--green);margin-bottom:0.15rem;letter-spacing:-0.01em;}
.lu-sub{font-family:'Libre Baskerville',serif;font-size:0.8rem;color:var(--text2);font-style:italic;}
.lu-bonuses{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin:0.9rem 0;}
.lu-bonus{background:rgba(0,192,48,0.1);border:1px solid var(--green);padding:0.25rem 0.6rem;font-family:'Raleway',sans-serif;font-size:0.62rem;color:var(--green);letter-spacing:0.06em;font-weight:700;}
.btn-lu-ok{background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-size:0.88rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.7rem 2.5rem;cursor:pointer;margin-top:0.5rem;transition:all 0.1s;}
.btn-lu-ok:hover{background:var(--green2);}
.btn-lu-ok:active{transform:scale(0.96);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:800;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--panel);border-top:1px solid var(--border2);width:100%;padding:1.3rem 1.3rem 2.5rem;transform:translateY(30px);transition:transform 0.3s;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 -4px 30px rgba(0,0,0,0.5);}
.modal-overlay.open .modal-box{transform:translateY(0);}

.btn-modal{background:var(--green);border:none;color:#060e08;font-family:'Raleway',sans-serif;font-size:0.85rem;font-weight:700;padding:0.75rem;cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:0.1em;-webkit-tap-highlight-color:transparent;transition:all 0.1s;}
.btn-modal:hover{background:var(--green2);}
.btn-modal:active{transform:scale(0.98);}
.btn-modal.secondary{background:transparent;border:1px solid var(--border2);color:var(--text3);font-size:0.75rem;font-weight:400;}
.btn-modal.secondary:hover{border-color:var(--green);color:var(--green);}

<script>
'use strict';

// ══════════════════════════════════
//  SIDEBAR TOGGLE (iPad fix)
// ══════════════════════════════════
function toggleSidebar(){
  const sb=document.getElementById('mainSidebar');
  sb.classList.toggle('open');
}
// Close sidebar when tapping content area on mobile
document.addEventListener('click',function(e){
  if(window.innerWidth<900){
    const sb=document.getElementById('mainSidebar');
    if(sb.classList.contains('open')&&!sb.contains(e.target)&&!e.target.closest('.sidebar-toggle')){
      sb.classList.remove('open');
    }
  }
},{passive:true});

// ══════════════════════════════════
//  NARRATOR
// ══════════════════════════════════
const CHARS={
  fraise:{svgFile:'fraise.svg',fallbackEmoji:'🍓',tag:'fraise',name:'Fraise',villain:false},
  poire:{svgFile:'poire.svg',fallbackEmoji:'🍐',tag:'poire',name:'Poire',villain:false},
  banane:{svgFile:'banane.svg',fallbackEmoji:'🍌',tag:'banane',name:'Banane',villain:true},
  narrateur:{svgFile:null,fallbackEmoji:'📖',tag:'narrateur',name:'Narrateur',villain:false},
};
const SVG_STATUS={};
function preloadSVGs(){['fraise','poire','banane'].forEach(id=>{const c=CHARS[id];if(!c.svgFile)return;const img=new Image();img.onload=()=>{SVG_STATUS[id]='ok';};img.onerror=()=>{SVG_STATUS[id]='fail';};img.src=c.svgFile;});}
function getCharSpriteHTML(charId){const c=CHARS[charId];if(!c)return`<span class="emoji-fallback">❓</span>`;if(c.svgFile&&SVG_STATUS[charId]!=='fail')return`<img src="${c.svgFile}" alt="${c.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" style="width:72px;height:72px;object-fit:contain;display:block;"><span class="emoji-fallback" style="display:none;font-size:3.8rem;line-height:1;">${c.fallbackEmoji}</span>`;return`<span class="emoji-fallback" style="font-size:3.8rem;line-height:1;">${c.fallbackEmoji}</span>`;}

const STORY_SEQUENCES={
  intro:[
    {char:'fraise',text:'Enfin ! Un combattant courageux qui ose affronter ce monde devenu fou... Je suis Fraise, et j\'ai besoin de ton aide !'},
    {char:'poire',text:'Moi c\'est Poire. Écoute ce que Fraise a à dire, c\'est sérieux. Depuis que Banane a pris le contrôle du Donjon de la Friture, tous les fruits et légumes tremblent.'},
    {char:'fraise',text:'La Banane nous a réduits en esclavage ! Elle vole nos récoltes, corrompt les monstres... Tu dois cultiver, cuisiner, et devenir assez fort pour la vaincre !'},
    {char:'banane',text:'Hahaha ! Un nouveau petit guerrier ? Tes légumes m\'appartiennent. Tes cuisines m\'appartiennent. TOI tu m\'appartiens. Ou tu seras écrasé en purée !'},
    {char:'poire',text:'Ne t\'inquiète pas ! On est là pour toi. Commence par cultiver dans la ferme, puis cuisine des plats pour te renforcer. On se bat ensemble !'},
  ],
  firstHarvest:[{char:'fraise',text:'Tu as réussi ta première récolte ! Je savais que tu y arriverais.'},{char:'poire',text:'Bien joué ! Maintenant cuisine ces ingrédients. Un bon plat peut doubler ta force en combat !'}],
  firstCook:[{char:'fraise',text:'Mmh, ça sent BON ! Tu es vraiment doué en cuisine. Mange ça avant de combattre !'},{char:'poire',text:'La Banane ne cuisine jamais elle-même. C\'est pour ça qu\'elle perdra...'}],
  firstFight:[{char:'poire',text:'Ton premier combat approche ! Rappelle-toi : Défense réduit les dégâts de 62%.'},{char:'fraise',text:'Et si tu accumules de la Rage, le coup Ultime ⚡ est dévastateur !'}],
  firstVictory:[{char:'fraise',text:'VICTOIRE ! Tu as vaincu ton premier ennemi ! La Banane va grincer des dents.'},{char:'poire',text:'Excellent combat ! Continue à progresser vers le Donjon de la Friture.'}],
  firstDefeat:[{char:'poire',text:'Aïe... Tu t\'es battu courageusement. Mais ce n\'est pas une défaite — c\'est une leçon.'},{char:'fraise',text:'Mange et repose-toi ! Cuisine quelque chose de bon et reviens.'},{char:'banane',text:'Hahaha ! Le petit guerrier est tombé ! Reste chez toi !'}],
  dangerZone:[{char:'banane',text:'Tu t\'aventures dans mes terres ? Mes serviteurs vont s\'occuper de toi...'},{char:'fraise',text:'Fais attention ! Cette zone est dangereuse. Cuisine des plats puissants avant de te battre ici.'}],
  reachDungeon:[{char:'fraise',text:'Le Donjon de la Friture... On y est enfin.'},{char:'poire',text:'Prépare tes meilleurs plats, équipe-toi au maximum. C\'est le combat final.'},{char:'banane',text:'Vous osez pénétrer dans MON donjon ?! Vous êtes fous !'},{char:'fraise',text:'On n\'a plus peur de toi, Banane ! Allons-y !'}],
  bossWarning:[{char:'banane',text:'Mon champion, le Bento Bakemono, n\'a jamais connu la défaite !'},{char:'poire',text:'Utilise TOUT — ton meilleur équipement, tes meilleures recettes.'}],
  level5:[{char:'poire',text:'Niveau 5 ! Tu es maintenant bien plus fort. La Banane commence à s\'inquiéter.'},{char:'fraise',text:'Des zones encore plus dangereuses s\'ouvrent à toi !'}],
  level10:[{char:'banane',text:'Niveau 10 ?! Impossible !'},{char:'fraise',text:'La Banane a PEUR ! Continue comme ça.'},{char:'poire',text:'Tu es prêt pour le Marais de l\'Ail et le Pic du Piment !'}],
  lootboxLegendary:[{char:'fraise',text:'Une Banane Secrète ?! C\'est la plus rare des lootboxes... On dit que la Banane y cache ses plus grands secrets !'},{char:'banane',text:'Espèce de... Comment tu as mis la main sur ça ?! Ces ressources m\'APPARTIENNENT !'}],
};

let NAR={queue:[],currentSeq:null,currentIdx:0,isTyping:false,typeTimer:null,seenSeqs:new Set(),enabled:true};
function loadNarratorState(){try{const r=localStorage.getItem('lunchboxe_nar_v1');if(r)NAR.seenSeqs=new Set(JSON.parse(r));}catch(e){}}
function saveNarratorState(){try{localStorage.setItem('lunchboxe_nar_v1',JSON.stringify([...NAR.seenSeqs]));}catch(e){}}
function triggerStory(seqId,force=false){if(!NAR.enabled)return;if(!force&&NAR.seenSeqs.has(seqId))return;const seq=STORY_SEQUENCES[seqId];if(!seq)return;NAR.seenSeqs.add(seqId);saveNarratorState();if(document.getElementById('narratorOverlay').classList.contains('show')){NAR.queue.push(seqId);return;}startNarratorSeq(seq,seqId);}
function startNarratorSeq(seq){NAR.currentSeq=seq;NAR.currentIdx=0;showNarratorLine(0);}
function showNarratorLine(idx){const seq=NAR.currentSeq;if(!seq||idx>=seq.length){closeNarrator();return;}const line=seq[idx];const charId=line.char;const char=CHARS[charId]||CHARS.narrateur;const spriteEl=document.getElementById('narratorSprite');spriteEl.innerHTML=getCharSpriteHTML(charId);spriteEl.className='char-sprite'+(char.villain?' villain':'');const tag=document.getElementById('narratorNameTag');tag.textContent=char.name;tag.className='char-name-tag '+char.tag;const dots=document.getElementById('narratorDots');dots.innerHTML=seq.map((_,i)=>`<div class="ndot ${i<idx?'done':i===idx?'active':''}"></div>`).join('');const nextBtn=document.getElementById('narratorNextBtn');nextBtn.textContent=idx===seq.length-1?'Fermer ✕':'Suivant ▶';document.getElementById('narratorOverlay').classList.add('show');typeNarratorText(line.text);addLog(`💬 <b>${char.name}</b> : ${line.text}`,'story');}
function typeNarratorText(text){clearTimeout(NAR.typeTimer);NAR.isTyping=true;const el=document.getElementById('narratorText');el.innerHTML='';let i=0;function tick(){if(i<text.length){el.innerHTML=text.slice(0,i+1)+'<span class="narrator-cursor"></span>';i++;NAR.typeTimer=setTimeout(tick,22);}else{el.innerHTML=text;NAR.isTyping=false;}}tick();}
function narratorTap(){if(NAR.isTyping){clearTimeout(NAR.typeTimer);NAR.isTyping=false;const line=NAR.currentSeq[NAR.currentIdx];document.getElementById('narratorText').innerHTML=line?line.text:'';}}
function narratorNext(){clearTimeout(NAR.typeTimer);NAR.isTyping=false;NAR.currentIdx++;if(!NAR.currentSeq||NAR.currentIdx>=NAR.currentSeq.length){closeNarrator();}else{showNarratorLine(NAR.currentIdx);}}
function skipNarrator(){clearTimeout(NAR.typeTimer);NAR.isTyping=false;closeNarrator();}
function closeNarrator(){document.getElementById('narratorOverlay').classList.remove('show');NAR.currentSeq=null;NAR.currentIdx=0;if(NAR.queue.length>0){const nextId=NAR.queue.shift();const seq=STORY_SEQUENCES[nextId];if(seq)setTimeout(()=>startNarratorSeq(seq,nextId),400);}}

  {id:'fantome_fromage',name:'Fantôme du Fromage',emoji:'🧀',region:'foret_champignon',level:5,hp:180,atk:[13,22],def:8,xp:65,gold:[35,65],loot:{mushroom:0.6,garlic:0.3},desc:'Personne ne sait d\'où vient son odeur...',special:{name:'Phase Camembert',eff:'armorPierce',chance:0.22}},

// Draw N rewards from lootbox (weighted)
function drawLootboxRewards(lb){
  const rewards=[];
  for(let d=0;d<lb.drawCount;d++){
    const totalWeight=lb.rewards.reduce((a,r)=>a+r.weight,0);
    let roll=Math.random()*totalWeight;
    let chosen=null;
    for(const r of lb.rewards){roll-=r.weight;if(roll<=0){chosen=r;break;}}
    if(!chosen)chosen=lb.rewards[0];
    const qty=Array.isArray(chosen.qty)?chosen.qty[0]+Math.floor(Math.random()*(chosen.qty[1]-chosen.qty[0]+1)):chosen.qty;
    rewards.push({...chosen,qty});
  }
  return rewards;
}

function applyLootboxRewards(rewards){
  const p=G.player;
  rewards.forEach(r=>{
    if(r.type==='gold'){G.gold+=r.qty;addLog(`💰 +${r.qty} Or de lootbox !`,'loot');}
    else if(r.type==='seed'){G.inventory[r.id]=(G.inventory[r.id]||0)+r.qty;addLog(`${r.emoji} +${r.qty} ${r.name} !`,'loot');}
    else if(r.type==='item'){G.inventory[r.id]=(G.inventory[r.id]||0)+r.qty;addLog(`${r.emoji} +${r.qty} ${r.name} !`,'loot');}
    else if(r.type==='equip'){
      if(!G.equipped[r.id]){
        const item=SHOP_ITEMS.find(i=>i.id===r.id);
        if(item){G.equipped[r.id]=true;G.player[item.stat]=(G.player[item.stat]||0)+item.val;addLog(`⚔️ Équipé : ${r.name} !`,'skill');}
      }else{G.gold+=50;addLog(`⚔️ ${r.name} déjà possédé → +50 Or !`,'loot');}
    }
    else if(r.type==='hpbonus'){p.maxHp+=r.qty;p.hp+=r.qty;addLog(`💖 +${r.qty} HP Max !`,'heal');}
    else if(r.type==='atkbonus'){p.atk+=r.qty;addLog(`🗡️ +${r.qty} ATK permanent !`,'skill');}
    else if(r.type==='curse'){p.maxHp=Math.max(20,p.maxHp-10);p.hp=Math.min(p.hp,p.maxHp);addLog(`💀 Malédiction ! -10 HP Max !`,'damage');}
  });
  updateHUD();
}

let pendingLootboxRewards=null;

function openLootbox(lbId){
  const lb=LOOTBOXES.find(l=>l.id===lbId);if(!lb)return;
  if(G.gold<lb.cost){showToast('Pas assez d\'or !','bad');return;}
  G.gold-=lb.cost;updateHUD();
  const rewards=drawLootboxRewards(lb);
  pendingLootboxRewards=rewards;
  // Show animation
  const overlay=document.getElementById('lbOpeningOverlay');
  const boxAnim=document.getElementById('lbBoxAnim');
  const title=document.getElementById('lbOpeningTitle');
  const sub=document.getElementById('lbOpeningSub');
  const grid=document.getElementById('lbRewardsGrid');
  boxAnim.textContent=lb.emoji;
  title.textContent='Ouverture en cours...';
  sub.textContent=lb.name;
  grid.innerHTML='';
  overlay.classList.add('show');
  // Show box shake then reveal rewards
  setTimeout(()=>{
    title.textContent='Tu as obtenu !';
    grid.innerHTML=rewards.map((r,i)=>{
      const rc={common:'lb-rarity-common',rare:'lb-rarity-rare',legendary:'lb-rarity-legendary',debuff:'lb-rarity-legendary'}[r.rarity]||'lb-rarity-common';
      return `<div class="lb-reward-item" style="animation-delay:${i*0.12}s">
        <span class="lb-reward-emoji">${r.emoji}</span>
        <div class="lb-reward-info">
          <div class="lb-reward-name">${r.name}</div>
          <div class="lb-reward-qty">${r.type==='gold'?'💰 +'+r.qty+' Or':'×'+r.qty}</div>
        </div>
        <span class="lb-reward-rarity ${rc}">${r.rarity==='debuff'?'MALÉDICTION':r.rarity.toUpperCase()}</span>
      </div>`;
    }).join('');
  },1600);
  if(lbId==='banane_secrete') setTimeout(()=>triggerStory('lootboxLegendary'),3000);
}

function collectLootbox(){
  if(pendingLootboxRewards){
    applyLootboxRewards(pendingLootboxRewards);
    pendingLootboxRewards=null;
  }
  document.getElementById('lbOpeningOverlay').classList.remove('show');
  showToast('Récompenses récupérées !','loot');
  if(document.getElementById('panelShop').classList.contains('active'))renderShop();
  saveGame();
}
