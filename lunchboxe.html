<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Lunch Boxe 🥊 — Le Jeu</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111;
      --surface2: #181818;
      --surface3: #202020;
      --border: #2a2a2a;
      --border2: #333;
      --red: #e8192c;
      --red-dark: #a0101e;
      --red-glow: rgba(232,25,44,0.4);
      --red-soft: rgba(232,25,44,0.12);
      --yellow: #f5c842;
      --yellow-glow: rgba(245,200,66,0.35);
      --yellow-soft: rgba(245,200,66,0.1);
      --green: #2ecc71;
      --green-soft: rgba(46,204,113,0.12);
      --blue: #3498db;
      --purple: #9b59b6;
      --orange: #e67e22;
      --text: #f0ede4;
      --text2: #aaa;
      --muted: #555;
      --accent: #c8f542;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .screen { display: none; width: 100%; height: 100vh; overflow: hidden; }
    .screen.active { display: flex; flex-direction: column; }

    /* ═══ TITLE ═══ */
    #screenTitle {
      background: radial-gradient(ellipse 80% 60% at 50% 40%, #1a0305 0%, #080808 70%);
      align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .title-bg-ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(232,25,44,0.12);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      animation: ringPulse 3s ease-in-out infinite;
    }
    .title-bg-ring:nth-child(1) { width: 500px; height: 500px; }
    .title-bg-ring:nth-child(2) { width: 700px; height: 700px; animation-delay: 1s; }
    .title-bg-ring:nth-child(3) { width: 350px; height: 350px; animation-delay: 0.5s; }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.04); }
    }
    .title-content { position: relative; z-index: 2; text-align: center; padding: 2rem; }
    .title-emoji {
      font-size: 5rem; display: block; margin-bottom: 0.5rem;
      animation: titleBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 40px var(--red-glow));
    }
    @keyframes titleBounce {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-14px) rotate(5deg); }
    }
    .title-main {
      font-family: 'Black Ops One', cursive;
      font-size: clamp(3rem, 11vw, 6rem);
      line-height: 0.9;
      background: linear-gradient(135deg, #fff 0%, var(--yellow) 40%, var(--red) 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 4px 20px var(--red-glow));
    }
    .title-sub {
      font-family: 'Oswald', sans-serif; font-size: 0.85rem; font-weight: 300;
      letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted);
      margin-top: 0.6rem; margin-bottom: 2.5rem;
    }
    .title-badges { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
    .badge {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 2px;
      padding: 0.3rem 0.8rem; font-size: 0.65rem; font-family: 'Oswald', sans-serif;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    .badge.hot { border-color: var(--red); color: var(--red); }
    .badge.gold { border-color: var(--yellow); color: var(--yellow); }
    .btn-play {
      background: var(--red); border: none; color: #fff;
      font-family: 'Black Ops One', cursive; font-size: 1.4rem;
      letter-spacing: 0.05em; padding: 1rem 3.5rem; border-radius: 4px;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 5px 0 var(--red-dark), 0 0 50px var(--red-glow);
      display: block; margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-play:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-dark); }
    .btn-play::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
    }
    .title-back-link {
      display: block; margin-top: 1.5rem; color: var(--muted);
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none; transition: color 0.2s;
    }

    /* ═══ GAME HUD ═══ */
    #screenGame { background: var(--bg); flex-direction: column; }
    .hud-top {
      background: rgba(8,8,8,0.98); border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.8rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.4rem;
      flex-shrink: 0; z-index: 10;
    }
    .hud-logo { font-family: 'Black Ops One', cursive; font-size: 0.95rem; color: var(--red); white-space: nowrap; }
    .hud-stats { display: flex; gap: 0.6rem; align-items: center; }
    .hud-stat { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
    .hud-stat-val { font-family: 'Black Ops One', cursive; font-size: 0.95rem; line-height: 1; }
    .hud-stat-label { font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .hud-stat.gold .hud-stat-val { color: var(--yellow); }
    .hud-stat.red .hud-stat-val { color: var(--red); }
    .hud-stat.green .hud-stat-val { color: var(--green); }

    .hud-xp-wrap {
      background: rgba(8,8,8,0.98); border-bottom: 1px solid var(--border);
      padding: 0.2rem 0.8rem; flex-shrink: 0; display: flex; align-items: center; gap: 0.6rem;
    }
    .hud-xp-label { font-family:'Oswald',sans-serif; font-size:0.55rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
    .hud-xp-track { flex:1; height:4px; background:rgba(255,255,255,0.05); border-radius:2px; overflow:hidden; }
    .hud-xp-fill { height:100%; background:linear-gradient(90deg,var(--purple),var(--blue)); border-radius:2px; transition:width 0.5s; }
    .hud-level { font-family:'Black Ops One',cursive; font-size:0.75rem; color:var(--purple); white-space:nowrap; }
    .hud-day { font-family:'Oswald',sans-serif; font-size:0.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
    .hud-day span { color:var(--text); font-weight:600; }

    .game-body { flex:1; overflow:hidden; position:relative; display:flex; flex-direction:column; min-height:0; }

    /* ═══ TABS ═══ */
    .tab-bar { display:flex; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
    .tab-btn {
      flex:1; padding:0.55rem 0.2rem; border:none; background:none; color:var(--muted);
      font-family:'Oswald',sans-serif; font-size:0.62rem; font-weight:500;
      letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
      transition:all 0.2s; border-bottom:2px solid transparent;
      display:flex; flex-direction:column; align-items:center; gap:1px;
      position:relative; -webkit-tap-highlight-color:transparent;
    }
    .tab-btn .tab-icon { font-size:1.05rem; }
    .tab-btn.active { color:var(--red); border-bottom-color:var(--red); }
    .tab-notif {
      position:absolute; top:5px; right:calc(50% - 20px);
      width:7px; height:7px; background:var(--red); border-radius:50%;
      animation:notifPulse 1s ease-in-out infinite;
    }
    @keyframes notifPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }

    .tab-panel { display:none; flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; min-height:0; }
    .tab-panel.active { display:flex; flex-direction:column; }

    /* ═══ FARM ═══ */
    .farm-area { padding:0.8rem; flex:1; }
    .farm-header {
      display:flex; justify-content:space-between; align-items:center; margin-bottom:0.7rem;
      font-family:'Oswald',sans-serif; font-size:0.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    }
    .farm-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.45rem; margin-bottom:0.8rem; }
    .plot {
      aspect-ratio:1; border-radius:8px; border:2px solid var(--border);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; transition:all 0.15s; position:relative; overflow:hidden;
      background:#0d0d0d; -webkit-tap-highlight-color:transparent;
    }
    .plot:active { transform:scale(0.91); }
    .plot.empty {
      background: repeating-linear-gradient(45deg,#0e0e0e 0px,#0e0e0e 4px,#0a0a0a 4px,#0a0a0a 8px);
      border-style:dashed; border-color:#2a2a2a;
    }
    .plot.empty:active { border-color:var(--red); background:rgba(232,25,44,0.04); }
    .plot.growing { background:#0d1a0d; border-color:#1a3a1a; }
    .plot.ready {
      background:#0d1a0d; border-color:var(--green);
      box-shadow:0 0 14px rgba(46,204,113,0.25);
      animation:readyPulse 1.5s ease-in-out infinite;
    }
    @keyframes readyPulse {
      0%,100%{ box-shadow:0 0 8px rgba(46,204,113,0.2); }
      50%{ box-shadow:0 0 22px rgba(46,204,113,0.55); }
    }
    .plot.locked { background:#0a0a0a; border-color:#1a1a1a; opacity:0.4; cursor:not-allowed; }
    .plot-emoji { font-size:1.75rem; line-height:1; }
    .plot-progress { position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.04); }
    .plot-progress-bar { height:100%; background:var(--green); transition:width 0.5s; }
    .plot-time { font-size:0.5rem; color:var(--muted); margin-top:2px; font-family:'Oswald',sans-serif; }
    .plot-lock-icon { font-size:1.1rem; }
    .plot-ready-badge {
      position:absolute; top:3px; right:3px;
      font-size:0.45rem; background:var(--green); color:#000; border-radius:2px;
      padding:1px 3px; font-family:'Black Ops One',cursive; letter-spacing:.03em;
    }

    .seeds-section { background:var(--surface); border-top:1px solid var(--border); padding:0.7rem 0.8rem; flex-shrink:0; }
    .seeds-label { font-family:'Oswald',sans-serif; font-size:0.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:0.5rem; display:flex; justify-content:space-between; align-items:center; }
    .seeds-row { display:flex; gap:0.4rem; overflow-x:auto; padding-bottom:0.2rem; }
    .seed-btn {
      flex-shrink:0; background:var(--surface2); border:2px solid var(--border); border-radius:8px;
      padding:0.4rem 0.6rem; cursor:pointer; text-align:center; transition:all 0.15s;
      min-width:60px; -webkit-tap-highlight-color:transparent;
    }
    .seed-btn:active { transform:scale(0.91); }
    .seed-btn.selected { border-color:var(--red); background:var(--red-soft); }
    .seed-btn.locked-seed { opacity:0.3; cursor:not-allowed; }
    .seed-emoji { font-size:1.3rem; display:block; }
    .seed-name { font-size:0.45rem; color:var(--muted); text-transform:uppercase; font-family:'Oswald',sans-serif; letter-spacing:.05em; }
    .seed-cost { font-size:0.55rem; color:var(--yellow); font-family:'Black Ops One',cursive; }
    .seed-time { font-size:0.45rem; color:var(--muted); }

    /* ═══ RECIPES ═══ */
    .recipes-area { padding:0.8rem; display:flex; flex-direction:column; gap:0.7rem; }
    .recipe-section-title {
      font-family:'Oswald',sans-serif; font-size:0.62rem; letter-spacing:.15em;
      text-transform:uppercase; color:var(--muted); margin-bottom:0.4rem;
      display:flex; align-items:center; gap:0.5rem;
    }
    .recipe-section-title::after { content:''; flex:1; height:1px; background:var(--border); }
    .recipe-card {
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      padding:0.8rem 1rem; cursor:pointer; transition:all 0.15s;
      -webkit-tap-highlight-color:transparent; display:flex; flex-direction:column; gap:0.4rem;
    }
    .recipe-card:active { transform:scale(0.97); border-color:var(--yellow); }
    .recipe-card.locked-recipe { opacity:0.35; cursor:not-allowed; }
    .recipe-card-top { display:flex; align-items:center; gap:0.7rem; }
    .recipe-emoji { font-size:2.2rem; flex-shrink:0; }
    .recipe-info { flex:1; }
    .recipe-name { font-family:'Oswald',sans-serif; font-weight:600; font-size:0.9rem; }
    .recipe-desc { font-size:0.6rem; color:var(--muted); line-height:1.4; margin-top:0.15rem; }
    .recipe-ingredients { display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.1rem; }
    .recipe-ing {
      background:var(--surface3); border:1px solid var(--border);
      border-radius:4px; padding:0.2rem 0.5rem; font-size:0.6rem;
      font-family:'Oswald',sans-serif; display:flex; align-items:center; gap:0.3rem;
    }
    .recipe-ing.have { border-color:var(--green); color:var(--green); }
    .recipe-ing.missing { border-color:var(--red); color:var(--text2); opacity:0.7; }
    .btn-cook {
      background:var(--yellow); border:none; color:#000;
      font-family:'Black Ops One',cursive; font-size:0.85rem;
      padding:0.5rem 1rem; border-radius:4px; cursor:pointer;
      transition:transform 0.1s; align-self:flex-end;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-cook:active { transform:scale(0.95); }
    .btn-cook:disabled { background:var(--surface3); color:var(--muted); cursor:not-allowed; }

    /* ═══ FIGHT — RPG BATTLE SCREEN ═══ */
    .fight-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    /* RPG Scene */
    .rpg-scene {
      flex:1; position:relative; overflow:hidden; min-height:0;
      display:flex; flex-direction:column;
    }
    .rpg-bg {
      position:absolute; inset:0;
      background: linear-gradient(180deg, #0d0508 0%, #150810 40%, #1a0a05 70%, #0a0a0a 100%);
    }
    .rpg-bg-floor {
      position:absolute; bottom:0; left:0; right:0; height:35%;
      background: linear-gradient(180deg, transparent 0%, rgba(60,20,10,0.4) 100%);
      border-top: 1px solid rgba(232,25,44,0.08);
    }
    .rpg-bg-grid {
      position:absolute; inset:0;
      background-image: linear-gradient(rgba(232,25,44,0.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(232,25,44,0.02) 1px,transparent 1px);
      background-size:32px 32px;
    }

    /* Enemy side (top) */
    .rpg-enemy-area {
      position:relative; z-index:2;
      display:flex; flex-direction:column; align-items:center;
      padding:0.6rem 0.8rem 0.3rem;
    }
    .rpg-enemy-name-row {
      display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;
    }
    .rpg-enemy-nameplate {
      font-family:'Black Ops One',cursive; font-size:0.9rem; color:var(--text);
    }
    .rpg-enemy-title-plate {
      font-family:'Oswald',sans-serif; font-size:0.58rem; letter-spacing:.12em;
      text-transform:uppercase; color:var(--red);
    }
    .rpg-hp-row { width:100%; display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; }
    .rpg-hp-label { font-family:'Oswald',sans-serif; font-size:0.52rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); width:20px; flex-shrink:0; }
    .rpg-hp-track { flex:1; height:10px; background:#1a0a0a; border:1px solid #3a1a1a; border-radius:2px; overflow:hidden; position:relative; }
    .rpg-hp-fill { height:100%; transition:width 0.4s ease; position:relative; }
    .rpg-hp-fill.enemy { background:linear-gradient(90deg,#7a0010,#e8192c); }
    .rpg-hp-fill.player { background:linear-gradient(90deg,#0a6a2a,#2ecc71); }
    .rpg-hp-fill::after {
      content:''; position:absolute; top:0; left:0; right:0; height:40%;
      background:rgba(255,255,255,0.12); border-radius:1px;
    }
    .rpg-hp-val { font-family:'Black Ops One',cursive; font-size:0.72rem; color:var(--text2); width:50px; text-align:right; flex-shrink:0; }
    .rpg-mp-row { width:100%; display:flex; align-items:center; gap:0.4rem; }
    .rpg-mp-track { flex:1; height:6px; background:#100e1a; border:1px solid #2a1a4a; border-radius:2px; overflow:hidden; }
    .rpg-mp-fill { height:100%; background:linear-gradient(90deg,#4a10a0,#9b59b6); transition:width 0.3s; }
    .rpg-mp-val { font-family:'Black Ops One',cursive; font-size:0.65rem; color:#9b59b6; width:50px; text-align:right; flex-shrink:0; }

    /* Sprites */
    .rpg-sprites-row {
      position:relative; z-index:2; flex:1; display:flex; align-items:flex-end;
      justify-content:space-between; padding:0 1.5rem 0.3rem;
    }
    .rpg-sprite {
      display:flex; flex-direction:column; align-items:center;
      transition:transform 0.12s;
    }
    .rpg-sprite-emoji {
      font-size: clamp(3rem, 12vw, 5.5rem);
      filter:drop-shadow(0 0 20px rgba(232,25,44,0.3));
      display:block; line-height:1;
      animation:spriteFloat 3s ease-in-out infinite;
    }
    .rpg-sprite-emoji.player-sprite {
      filter:drop-shadow(0 0 16px rgba(46,204,113,0.3));
      animation:spriteFloat 2.5s ease-in-out infinite reverse;
    }
    @keyframes spriteFloat {
      0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}
    }
    .rpg-sprite-shadow {
      width:50px; height:6px; background:rgba(0,0,0,0.5);
      border-radius:50%; margin-top:2px; filter:blur(3px);
    }
    .rpg-sprite-label { font-family:'Oswald',sans-serif; font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }

    .rpg-sprite-emoji.hit { animation:hitShake 0.28s forwards; }
    .rpg-sprite-emoji.dodge { animation:dodgeAnim 0.3s forwards; }
    .rpg-sprite-emoji.attack-anim { animation:attackPoke 0.22s ease-out forwards; }
    @keyframes hitShake {
      0%{transform:translateX(0) scale(1)} 20%{transform:translateX(-12px) scale(1.1)}
      50%{transform:translateX(10px) scale(0.92)} 80%{transform:translateX(-4px) scale(1.04)}
      100%{transform:translateX(0) scale(1)}
    }
    @keyframes dodgeAnim {
      0%{transform:translateX(0)} 30%{transform:translateX(22px) rotate(12deg)}
      70%{transform:translateX(-6px)} 100%{transform:translateX(0)}
    }
    @keyframes attackPoke {
      0%{transform:translateX(0)} 40%{transform:translateX(18px)}
      100%{transform:translateX(0)}
    }

    /* Status effects on sprites */
    .status-icons { display:flex; gap:2px; margin-top:2px; justify-content:center; }
    .status-icon { font-size:0.7rem; }

    /* Buffs display */
    .rpg-buffs-row {
      position:relative; z-index:2;
      display:flex; justify-content:center; gap:0.3rem; flex-wrap:wrap;
      padding:0.2rem 0.8rem; min-height:1.4rem;
    }
    .buff-pill {
      background:rgba(245,200,66,0.15); border:1px solid var(--yellow);
      border-radius:10px; padding:0.12rem 0.45rem;
      font-size:0.5rem; color:var(--yellow); font-family:'Oswald',sans-serif;
    }
    .buff-pill.def { background:rgba(52,152,219,0.15); border-color:var(--blue); color:var(--blue); }
    .buff-pill.crit { background:rgba(232,25,44,0.15); border-color:var(--red); color:var(--red); }
    .buff-pill.poison { background:rgba(46,204,113,0.15); border-color:#27ae60; color:#27ae60; }
    .buff-pill.stun { background:rgba(255,220,50,0.15); border-color:#f39c12; color:#f39c12; }

    /* Battle log (RPG-style scrolling text box) */
    .rpg-battle-log {
      position:relative; z-index:3;
      background:rgba(8,4,4,0.92); border-top:1px solid #2a1a1a;
      padding:0.5rem 0.8rem; min-height:2.8rem; flex-shrink:0;
    }
    .rpg-log-line { font-family:'Oswald',sans-serif; font-size:0.72rem; letter-spacing:.03em; color:var(--text2); }
    .rpg-log-line.atk { color:var(--yellow); }
    .rpg-log-line.hurt { color:var(--red); }
    .rpg-log-line.heal { color:var(--green); }
    .rpg-log-line.sys { color:var(--muted); font-style:italic; }
    .rpg-log-line.crit { color:#fff; font-weight:700; text-shadow:0 0 10px var(--yellow); }
    .rpg-log-line.special { color:var(--purple); }

    /* ATB / Turn bar */
    .rpg-atb-section {
      background:var(--surface2); border-top:1px solid var(--border); padding:0.4rem 0.8rem; flex-shrink:0;
      display:flex; align-items:center; gap:0.6rem;
    }
    .rpg-atb-label { font-family:'Oswald',sans-serif; font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; white-space:nowrap; }
    .rpg-atb-track { flex:1; height:6px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; }
    .rpg-atb-fill { height:100%; background:linear-gradient(90deg,#e8a019,var(--yellow)); border-radius:3px; transition:width 0.3s; }
    .rpg-atb-val { font-family:'Black Ops One',cursive; font-size:0.65rem; color:var(--yellow); width:36px; text-align:center; flex-shrink:0; }

    /* ═══ FIGHT CONTROLS ═══ */
    .fight-controls { background:var(--surface); border-top:1px solid var(--border); padding:0.55rem; flex-shrink:0; }

    /* Move grid: 2 rows, styled like RPG ability menu */
    .rpg-move-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:0.3rem; margin-bottom:0.35rem; }
    .move-btn {
      border:none; border-radius:6px; padding:0.45rem 0.15rem; cursor:pointer; font-family:'Black Ops One',cursive;
      font-size:0.55rem; letter-spacing:.02em; transition:all 0.12s;
      display:flex; flex-direction:column; align-items:center; gap:2px;
      -webkit-tap-highlight-color:transparent; position:relative; overflow:hidden;
    }
    .move-btn::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,0.1) 0%,transparent 50%); }
    .move-btn:active { transform:scale(0.92) translateY(2px); }
    .move-btn:disabled { opacity:0.25; cursor:not-allowed; transform:none; }
    .move-btn .move-emoji { font-size:1rem; }
    .move-btn .move-cost { font-size:0.42rem; color:rgba(255,255,255,0.5); font-family:'Oswald',sans-serif; }
    .move-btn.jab     { background:#2c1a0e; border:1px solid #5a3018; color:#e8a019; }
    .move-btn.cross   { background:#1a0e2c; border:1px solid #38185a; color:var(--purple); }
    .move-btn.hook    { background:#0e1f2c; border:1px solid #183850; color:var(--blue); }
    .move-btn.uppercut{ background:#2c1a1a; border:1px solid #5a2020; color:var(--red); }
    .move-btn.special { background:#1a1a0e; border:1px solid #3a3a10; color:var(--yellow); animation:specialGlow 2s ease-in-out infinite; }
    .move-btn.defend  { background:#0e1a20; border:1px solid #104060; color:var(--blue); }
    .move-btn.taunt   { background:#1a100e; border:1px solid #4a1a0a; color:var(--orange); }
    @keyframes specialGlow { 0%,100%{box-shadow:0 0 6px rgba(245,200,66,0.2)} 50%{box-shadow:0 0 16px rgba(245,200,66,0.5)} }

    .fight-actions-row { display:flex; gap:0.4rem; }
    .btn-use-food {
      flex:1; background:var(--surface3); border:1px solid var(--border); color:var(--text);
      font-family:'Oswald',sans-serif; font-size:0.7rem; letter-spacing:.05em;
      padding:0.5rem; border-radius:6px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    .btn-use-food:active { border-color:var(--yellow); color:var(--yellow); transform:scale(0.96); }
    .btn-flee {
      background:var(--surface3); border:1px solid var(--border); color:var(--muted);
      font-family:'Oswald',sans-serif; font-size:0.7rem; letter-spacing:.05em;
      padding:0.5rem 0.8rem; border-radius:6px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    .btn-flee:active { border-color:var(--red); color:var(--red); transform:scale(0.96); }

    /* ═══ FIGHT SCREENS ═══ */
    .fight-intro, .fight-victory, .fight-defeat {
      display:flex; flex-direction:column; align-items:center; gap:0.7rem;
      padding:1.2rem; text-align:center; width:100%;
    }
    .fight-intro h2, .fight-victory h2, .fight-defeat h2 { font-family:'Black Ops One',cursive; font-size:1.4rem; }
    .fight-intro p, .fight-victory p, .fight-defeat p { font-size:0.78rem; color:var(--text2); line-height:1.5; }
    .fight-intro-emoji, .fight-victory-emoji, .fight-defeat-emoji { font-size:4rem; filter:drop-shadow(0 0 20px rgba(232,25,44,0.5)); }

    /* Enemy intro — lore card */
    .enemy-lore-card {
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      padding:0.8rem 1rem; width:100%; max-width:340px; text-align:left;
    }
    .enemy-lore-name { font-family:'Black Ops One',cursive; font-size:1.1rem; color:var(--red); }
    .enemy-lore-title { font-family:'Oswald',sans-serif; font-size:0.62rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-bottom:0.5rem; }
    .enemy-lore-text { font-size:0.72rem; color:var(--text2); line-height:1.6; font-style:italic; }
    .enemy-lore-stats { display:flex; gap:1rem; margin-top:0.6rem; flex-wrap:wrap; }
    .enemy-lore-stat { font-family:'Oswald',sans-serif; font-size:0.65rem; color:var(--muted); }
    .enemy-lore-stat span { color:var(--yellow); font-weight:700; }
    .enemy-abilities { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.5rem; }
    .ability-tag {
      background:var(--surface3); border:1px solid var(--border); border-radius:3px;
      padding:0.18rem 0.5rem; font-size:0.55rem; font-family:'Oswald',sans-serif;
      letter-spacing:.06em; text-transform:uppercase; color:var(--text2);
    }
    .ability-tag.dangerous { border-color:var(--red); color:var(--red); }

    .fight-rewards { display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; }
    .reward-item { text-align:center; }
    .reward-val { font-family:'Black Ops One',cursive; font-size:1.3rem; color:var(--yellow); }
    .reward-label { font-size:0.6rem; color:var(--muted); font-family:'Oswald',sans-serif; letter-spacing:.08em; text-transform:uppercase; }
    .btn-fight-start {
      background:var(--red); border:none; color:#fff;
      font-family:'Black Ops One',cursive; font-size:1.1rem;
      padding:0.9rem 2.5rem; border-radius:4px; cursor:pointer;
      box-shadow:0 4px 0 var(--red-dark), 0 0 30px var(--red-glow);
      transition:transform 0.1s, box-shadow 0.1s; -webkit-tap-highlight-color:transparent;
    }
    .btn-fight-start:active { transform:translateY(3px); box-shadow:0 1px 0 var(--red-dark); }
    .btn-fight-next {
      background:var(--yellow); border:none; color:#000;
      font-family:'Black Ops One',cursive; font-size:1.1rem;
      padding:0.9rem 2.5rem; border-radius:4px; cursor:pointer;
      transition:transform 0.1s; -webkit-tap-highlight-color:transparent;
    }
    .btn-fight-next:active { transform:scale(0.95); }

    /* Enemy select list */
    .enemy-list { width:100%; display:flex; flex-direction:column; gap:0.45rem; max-width:380px; }
    .enemy-card {
      background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:0.7rem 0.9rem; display:flex; align-items:center; gap:0.7rem;
      cursor:pointer; transition:all 0.15s; -webkit-tap-highlight-color:transparent;
    }
    .enemy-card:active { transform:scale(0.97); border-color:var(--red); background:var(--red-soft); }
    .enemy-card.locked-enemy { opacity:0.35; cursor:not-allowed; }
    .enemy-card .ec-emoji { font-size:1.9rem; flex-shrink:0; }
    .enemy-card .ec-info { flex:1; }
    .enemy-card .ec-name { font-family:'Oswald',sans-serif; font-weight:600; font-size:0.87rem; }
    .enemy-card .ec-title { font-size:0.58rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-family:'Oswald',sans-serif; }
    .enemy-card .ec-diff { font-family:'Black Ops One',cursive; font-size:0.72rem; padding:0.18rem 0.45rem; border-radius:2px; }
    .diff-easy { background:rgba(46,204,113,0.12); color:var(--green); }
    .diff-med  { background:rgba(245,200,66,0.12); color:var(--yellow); }
    .diff-hard { background:rgba(232,25,44,0.12); color:var(--red); }
    .diff-boss { background:rgba(142,68,173,0.18); color:#c39bd3; }

    /* ═══ SHOP ═══ */
    .shop-area { padding:0.8rem; display:flex; flex-direction:column; gap:0.9rem; }
    .shop-section-title {
      font-family:'Oswald',sans-serif; font-size:0.62rem; letter-spacing:.15em;
      text-transform:uppercase; color:var(--muted); margin-bottom:0.45rem;
      display:flex; align-items:center; gap:0.5rem;
    }
    .shop-section-title::after { content:''; flex:1; height:1px; background:var(--border); }
    .shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; }
    .shop-item {
      background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:0.75rem; cursor:pointer; transition:all 0.15s;
      -webkit-tap-highlight-color:transparent; position:relative;
    }
    .shop-item:active { transform:scale(0.95); }
    .shop-item.owned { border-color:var(--green); }
    .shop-item.owned::after { content:'✓'; position:absolute; top:6px; right:8px; font-size:0.7rem; color:var(--green); }
    .shop-item.cant-afford { opacity:0.4; cursor:not-allowed; }
    .shop-item-emoji { font-size:1.9rem; margin-bottom:0.25rem; display:block; }
    .shop-item-name { font-family:'Oswald',sans-serif; font-size:0.78rem; font-weight:500; }
    .shop-item-desc { font-size:0.58rem; color:var(--muted); margin-top:0.15rem; line-height:1.4; }
    .shop-item-price { display:flex; align-items:center; gap:0.25rem; margin-top:0.45rem; font-family:'Black Ops One',cursive; font-size:0.82rem; color:var(--yellow); }

    /* ═══ INVENTORY ═══ */
    .inv-area { padding:0.8rem; display:flex; flex-direction:column; gap:0.9rem; }
    .inv-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.45rem; }
    .inv-item {
      background:var(--surface2); border:1px solid var(--border); border-radius:6px;
      aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; transition:all 0.15s; position:relative; -webkit-tap-highlight-color:transparent;
    }
    .inv-item:active { transform:scale(0.91); }
    .inv-item.empty-slot { border-style:dashed; border-color:#222; cursor:default; }
    .inv-emoji { font-size:1.55rem; }
    .inv-qty { position:absolute; bottom:2px; right:4px; font-family:'Black Ops One',cursive; font-size:0.62rem; color:var(--yellow); }

    .player-stats-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:0.9rem; }
    .player-stats-title { font-family:'Oswald',sans-serif; font-size:0.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:0.75rem; }
    .stats-rows { display:flex; flex-direction:column; gap:0.55rem; }
    .stat-row { display:flex; align-items:center; gap:0.55rem; }
    .stat-row-label { font-family:'Oswald',sans-serif; font-size:0.68rem; color:var(--muted); width:78px; flex-shrink:0; }
    .stat-bar-track { flex:1; height:6px; background:rgba(255,255,255,0.04); border-radius:3px; overflow:hidden; }
    .stat-bar-fill { height:100%; border-radius:3px; transition:width 0.4s; }
    .stat-atk .stat-bar-fill { background:var(--red); }
    .stat-def .stat-bar-fill { background:var(--blue); }
    .stat-spd .stat-bar-fill { background:var(--yellow); }
    .stat-row-val { font-family:'Black Ops One',cursive; font-size:0.72rem; width:28px; text-align:right; flex-shrink:0; }

    /* ═══ TOASTS & FX ═══ */
    .toast {
      position:fixed; top:80px; left:50%;
      transform:translateX(-50%) translateY(-20px);
      background:var(--surface2); border:1px solid var(--border); border-radius:6px;
      padding:0.55rem 1.1rem; font-family:'Oswald',sans-serif; font-size:0.82rem;
      letter-spacing:.05em; pointer-events:none; opacity:0; transition:all 0.25s; z-index:1000;
      white-space:nowrap; max-width:90vw;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success { border-color:var(--green); color:var(--green); }
    .toast.error   { border-color:var(--red); color:var(--red); }
    .toast.gold    { border-color:var(--yellow); color:var(--yellow); }
    .toast.level   { border-color:var(--purple); color:var(--purple); background:rgba(155,89,182,0.15); }

    .harvest-float {
      position:fixed; font-family:'Black Ops One',cursive; font-size:1.2rem;
      color:var(--yellow); pointer-events:none; z-index:500;
      animation:harvestFloat 1s ease-out forwards;
    }
    @keyframes harvestFloat { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-65px)} }
    .cook-float {
      position:fixed; font-size:1.8rem; pointer-events:none; z-index:500;
      animation:cookFloat 1.2s ease-out forwards;
    }
    @keyframes cookFloat { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(0.5)} }

    .dmg-number {
      position:fixed; font-family:'Black Ops One',cursive; pointer-events:none;
      z-index:300; animation:dmgFloat 0.9s ease-out forwards;
    }
    .dmg-number.player-dmg { color:var(--red); font-size:1.45rem; }
    .dmg-number.enemy-dmg  { color:var(--yellow); font-size:1.9rem; }
    .dmg-number.crit-dmg   { color:#fff; font-size:2.3rem; text-shadow:0 0 20px var(--yellow); }
    .dmg-number.heal-dmg   { color:var(--green); font-size:1.4rem; }
    .dmg-number.miss-dmg   { color:var(--muted); font-size:1.1rem; }
    @keyframes dmgFloat {
      0%{opacity:1;transform:translateY(0) scale(1)}
      60%{opacity:1;transform:translateY(-45px) scale(1.25)}
      100%{opacity:0;transform:translateY(-80px) scale(0.8)}
    }

    /* ═══ MODAL ═══ */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200;
      display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity 0.25s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal-box {
      background:var(--surface); border-top:1px solid var(--border); border-radius:18px 18px 0 0;
      width:100%; padding:1.5rem 1.5rem 2rem; transform:translateY(40px);
      transition:transform 0.3s; max-height:85vh; overflow-y:auto;
    }
    .modal-overlay.open .modal-box { transform:translateY(0); }
    .modal-title { font-family:'Black Ops One',cursive; font-size:1.25rem; margin-bottom:0.25rem; }
    .modal-desc  { font-size:0.78rem; color:var(--muted); margin-bottom:1rem; line-height:1.5; }
    .modal-actions { display:flex; flex-direction:column; gap:0.55rem; margin-top:0.9rem; }
    .btn-modal-primary {
      background:var(--red); border:none; color:#fff;
      font-family:'Black Ops One',cursive; font-size:1rem;
      padding:0.85rem; border-radius:4px; cursor:pointer; width:100%;
      box-shadow:0 4px 0 var(--red-dark); -webkit-tap-highlight-color:transparent;
    }
    .btn-modal-primary:active { transform:translateY(3px); box-shadow:0 1px 0 var(--red-dark); }
    .btn-modal-secondary {
      background:none; border:1px solid var(--border); color:var(--muted);
      font-family:'Oswald',sans-serif; font-size:0.82rem;
      padding:0.65rem; border-radius:4px; cursor:pointer; width:100%;
      -webkit-tap-highlight-color:transparent;
    }

    /* ═══ LEVEL UP ═══ */
    .levelup-overlay {
      position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.75); opacity:0; pointer-events:none; transition:opacity 0.3s;
    }
    .levelup-overlay.show { opacity:1; pointer-events:all; }
    .levelup-box {
      background:var(--surface); border:2px solid var(--purple);
      border-radius:16px; padding:2rem; text-align:center;
      box-shadow:0 0 60px rgba(155,89,182,0.4);
      animation:levelupPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    @keyframes levelupPop { 0%{transform:scale(0.5) rotate(-5deg)} 100%{transform:scale(1) rotate(0)} }
    .levelup-emoji { font-size:4rem; display:block; }
    .levelup-title { font-family:'Black Ops One',cursive; font-size:1.8rem; color:var(--purple); margin:0.3rem 0; }
    .levelup-sub { font-size:0.8rem; color:var(--text2); }
    .levelup-bonuses { display:flex; gap:1rem; justify-content:center; margin:1rem 0; flex-wrap:wrap; }
    .lvl-bonus { background:var(--surface2); border:1px solid var(--purple); border-radius:6px; padding:0.4rem 0.8rem; font-family:'Black Ops One',cursive; font-size:0.8rem; color:var(--purple); }
    .btn-levelup-ok { background:var(--purple); border:none; color:#fff; font-family:'Black Ops One',cursive; font-size:1rem; padding:0.7rem 2rem; border-radius:4px; cursor:pointer; margin-top:0.3rem; }

    .game-back-link {
      display:inline-flex; align-items:center; gap:0.4rem; color:var(--muted);
      font-size:0.62rem; text-decoration:none; font-family:'Oswald',sans-serif;
      letter-spacing:.08em; text-transform:uppercase; padding:0 0.3rem;
    }

    /* ═══ DIFFICULTY WARNING ═══ */
    .diff-warning {
      background:rgba(232,25,44,0.08); border:1px solid rgba(232,25,44,0.3);
      border-radius:6px; padding:0.5rem 0.7rem; font-size:0.65rem; color:var(--red);
      font-family:'Oswald',sans-serif; letter-spacing:.05em; margin-top:0.3rem;
      display:flex; align-items:center; gap:0.4rem;
    }

    ::-webkit-scrollbar { width:3px; height:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }
  </style>
</head>
<body>

<!-- TITLE SCREEN -->
<div class="screen active" id="screenTitle">
  <div class="title-bg-ring"></div>
  <div class="title-bg-ring"></div>
  <div class="title-bg-ring"></div>
  <div class="title-content">
    <span class="title-emoji">🥊</span>
    <div class="title-main">LUNCH BOXE</div>
    <div class="title-sub">Farm · Fight · Feast</div>
    <div class="title-badges">
      <span class="badge hot">🥊 Combat RPG</span>
      <span class="badge">🌱 Ferme</span>
      <span class="badge gold">👨‍🍳 Recettes</span>
    </div>
    <button class="btn-play" onclick="startGame()">🥊 JOUER</button>
    <a href="index.html" class="title-back-link">← Retour à Lunchboxd</a>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="screenGame">
  <div class="hud-top">
    <a href="index.html" class="game-back-link">🥡</a>
    <div class="hud-logo">🥊 L.BOXE</div>
    <div class="hud-stats">
      <div class="hud-stat gold">
        <span class="hud-stat-val" id="hudGold">0</span>
        <span class="hud-stat-label">💰 Or</span>
      </div>
      <div class="hud-stat red">
        <span class="hud-stat-val" id="hudHP">100</span>
        <span class="hud-stat-label">❤️ HP</span>
      </div>
      <div class="hud-stat green">
        <span class="hud-stat-val" id="hudStreak">0</span>
        <span class="hud-stat-label">🔥 Série</span>
      </div>
    </div>
    <div class="hud-day">Jour <span id="hudDay">1</span></div>
  </div>
  <div class="hud-xp-wrap">
    <div class="hud-level" id="hudLevel">LVL 1</div>
    <div class="hud-xp-track"><div class="hud-xp-fill" id="hudXpBar" style="width:0%"></div></div>
    <div class="hud-xp-label" id="hudXpText">0 / 80 XP</div>
  </div>

  <div class="game-body">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('farm')" id="tabFarm">
        <span class="tab-icon">🌱</span>Ferme
      </button>
      <button class="tab-btn" onclick="switchTab('recipes')" id="tabRecipes">
        <span class="tab-icon">👨‍🍳</span>Cuisine
      </button>
      <button class="tab-btn" onclick="switchTab('fight')" id="tabFight">
        <span class="tab-icon">🥊</span>Combat
      </button>
      <button class="tab-btn" onclick="switchTab('shop')" id="tabShop">
        <span class="tab-icon">🛒</span>Marché
      </button>
      <button class="tab-btn" onclick="switchTab('inv')" id="tabInv">
        <span class="tab-icon">🎒</span>Sac
      </button>
    </div>

    <div class="tab-panel active" id="panelFarm">
      <div class="farm-area">
        <div class="farm-header">
          <span id="farmTitle">🌱 Ferme</span>
          <span id="farmReadyCount" style="color:var(--green)"></span>
        </div>
        <div class="farm-grid" id="farmGrid"></div>
      </div>
      <div class="seeds-section">
        <div class="seeds-label">
          <span>Graines — sélectionne puis tape une parcelle</span>
          <span id="seedGoldLabel" style="color:var(--yellow)"></span>
        </div>
        <div class="seeds-row" id="seedsRow"></div>
      </div>
    </div>

    <div class="tab-panel" id="panelRecipes">
      <div class="recipes-area" id="recipesArea"></div>
    </div>

    <div class="tab-panel" id="panelFight">
      <div class="fight-area" id="fightArea"></div>
    </div>

    <div class="tab-panel" id="panelShop">
      <div class="shop-area" id="shopArea"></div>
    </div>

    <div class="tab-panel" id="panelInv">
      <div class="inv-area" id="invArea"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">

// ══════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════
function saveGame() {
  try {
    const save = {
      gold:state.gold, day:state.day, player:state.player,
      plots:state.plots, inventory:state.inventory, cooked:state.cooked,
      equipped:state.equipped, wins:state.wins, xp:state.xp, level:state.level, tick:state.tick,
    };
    localStorage.setItem('lunchboxe_save2', JSON.stringify(save));
  } catch(e) {}
}
function loadGame() {
  try {
    var raw = localStorage.getItem('lunchboxe_save2');
    if (!raw) return false;
    var save = JSON.parse(raw);
    Object.assign(state, save);
    state.fightState = 'select';
    state.currentEnemy = null;
    state.enemyHp = 0;
    state.buffs = { atk:0, def:0, rounds:0, nextCrit:false };
    state.debuffs = { atk:0, def:0, rounds:0, blind:0, burn:0, poison:0, stun:0 };
    state.enemyDebuffs = { def:0, rounds:0, burn:0, poison:0 };
    state.defending = false;
    state.enemySpecialUsed = {};
    state.combatLog = [];
    return true;
  } catch(e) { return false; }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function startGame() {
  var loaded = loadGame();
  showScreen('screenGame');
  renderAll();
  setInterval(gameTick, 1000);
  setInterval(saveGame, 15000);
  if (loaded) toast('💾 Partie chargée !', 'success');
}

// ══════════════════════════════════════════
//  TAB SWITCH
// ══════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  var T = tab.charAt(0).toUpperCase() + tab.slice(1);
  document.getElementById('tab'+T).classList.add('active');
  document.getElementById('panel'+T).classList.add('active');
  if (tab==='fight')   renderFight();
  if (tab==='shop')    renderShop();
  if (tab==='inv')     renderInv();
  if (tab==='recipes') renderRecipes();
}

// ══════════════════════════════════════════
//  TICK
// ══════════════════════════════════════════
function gameTick() {
  state.tick++;
  if (state.tick % 150 === 0) {
    state.day++;
    document.getElementById('hudDay').textContent = state.day;
    toast('☀️ Jour '+state.day+' — Les ennemis se renforcent...', 'gold');
    state.player.hp = Math.min(state.player.maxHp, state.player.hp + 4);
    updateHUD(); renderSeeds(); checkFarmNotif();
  }
  var anyReady = false;
  state.plots.forEach(function(plot) {
    if (plot.crop && plot.growTime && plot.status !== 'ready') {
      var elapsed = state.tick - plot.plantedAt;
      if (elapsed >= plot.growTime) { plot.status = 'ready'; anyReady = true; }
    }
  });
  if (anyReady) { renderFarm(); checkFarmNotif(); }
  if (state.tick % 5 === 0) renderFarmProgress();
}

function checkFarmNotif() {
  var ready = state.plots.filter(function(p) { return p.status==='ready'; }).length;
  var notif = document.getElementById('farmReadyCount');
  if (notif) notif.textContent = ready>0 ? ('✅ '+ready+' prête'+(ready>1?'s':'')) : '';
  var btn = document.getElementById('tabFarm');
  var n = btn.querySelector('.tab-notif');
  if (ready>0 && !n) { n=document.createElement('span'); n.className='tab-notif'; btn.appendChild(n); }
  else if (ready===0 && n) n.remove();
}

function renderAll() { updateHUD(); renderFarm(); renderSeeds(); checkFarmNotif(); }

function updateHUD() {
  document.getElementById('hudGold').textContent = state.gold;
  document.getElementById('hudHP').textContent = state.player.hp;
  document.getElementById('hudStreak').textContent = state.player.streak;
  var lvl = state.level;
  var xpForNext = LEVEL_XP[lvl] || LEVEL_XP[LEVEL_XP.length-1];
  var xpBase = lvl>1 ? LEVEL_XP[lvl-1] : 0;
  var progress = Math.min(100, ((state.xp-xpBase)/(xpForNext-xpBase))*100);
  document.getElementById('hudXpBar').style.width = progress+'%';
  document.getElementById('hudLevel').textContent = 'LVL '+lvl;
  document.getElementById('hudXpText').textContent = (state.xp-xpBase)+' / '+(xpForNext-xpBase)+' XP';
  document.getElementById('hudDay').textContent = state.day;
  document.getElementById('seedGoldLabel').textContent = '💰 '+state.gold;
}

function gainXP(amount) {
  state.xp += amount;
  var maxLevel = LEVEL_XP.length;
  while (state.level < maxLevel && state.xp >= LEVEL_XP[state.level]) {
    state.level++;
    triggerLevelUp();
  }
  updateHUD();
}

function triggerLevelUp() {
  var lvl = state.level;
  var bonuses = [];
  state.player.maxHp += 12; state.player.hp += 12; bonuses.push('+12 HP Max');
  state.player.atk += 3; bonuses.push('+3 ATK');
  if (lvl%2===0) { state.player.def+=3; bonuses.push('+3 DEF'); }
  if (lvl%3===0) { state.player.maxRage+=10; bonuses.push('+10 Rage Max'); }
  document.getElementById('levelupTitle').textContent = 'NIVEAU '+lvl+' !';
  var bonusEl = document.getElementById('levelupBonuses');
  bonusEl.innerHTML = bonuses.map(function(b){ return '<div class="lvl-bonus">'+b+'</div>'; }).join('');
  document.getElementById('levelupOverlay').classList.add('show');
  saveGame();
}
function closeLevelUp() { document.getElementById('levelupOverlay').classList.remove('show'); updateHUD(); }

// ══════════════════════════════════════════

// ══════════════════════════════════════════
function renderFarm() {
  var grid = document.getElementById('farmGrid');
  grid.innerHTML = '';
  state.plots.forEach(function(plot, i) {
    var el = document.createElement('div');
    el.className = 'plot';
    el.dataset.plot = i;
    if (plot.locked) {
      el.classList.add('locked');
      el.innerHTML = '<span class="plot-lock-icon">🔒</span>';
    } else if (!plot.crop) {
      el.classList.add('empty');
      el.innerHTML = '<span style="font-size:0.9rem;color:#333">＋</span>';
      el.onclick = function() { plantSeed(i); };
    } else {
      var elapsed = state.tick - plot.plantedAt;
      var prog = Math.min(1, elapsed/plot.growTime);
      if (plot.status==='ready') {
        el.classList.add('ready');
        el.innerHTML = '<span class="plot-emoji">'+plot.crop.emoji+'</span><div class="plot-ready-badge">PRÊT</div><div class="plot-progress"><div class="plot-progress-bar" style="width:100%"></div></div>';
        el.onclick = function() { harvest(i, el); };
      } else {
        el.classList.add('growing');
        var remaining = Math.max(0, plot.growTime-elapsed);
        el.innerHTML = '<span class="plot-emoji" style="opacity:0.55;filter:grayscale(0.6)">'+plot.crop.emoji+'</span><span class="plot-time">'+remaining+'s</span><div class="plot-progress"><div class="plot-progress-bar" style="width:'+(prog*100)+'%"></div></div>';
      }
    }
    grid.appendChild(el);
  });
}

function renderFarmProgress() {
  state.plots.forEach(function(plot, i) {
    if (!plot.crop || plot.status==='ready') return;
    var el = document.querySelector('.plot[data-plot="'+i+'"]');
    if (!el) return;
    var elapsed = state.tick-plot.plantedAt;
    var prog = Math.min(1, elapsed/plot.growTime);
    var bar = el.querySelector('.plot-progress-bar');
    var timeEl = el.querySelector('.plot-time');
    if (bar) bar.style.width = (prog*100)+'%';
    if (timeEl) timeEl.textContent = Math.max(0, plot.growTime-elapsed)+'s';
  });
}

function renderSeeds() {
  var row = document.getElementById('seedsRow');
  row.innerHTML = '';
  SEEDS.forEach(function(seed) {
    var locked = seed.unlockDay > state.day;
    var btn = document.createElement('div');
    btn.className = 'seed-btn'+(seed.id===state.selectedSeed?' selected':'')+(locked?' locked-seed':'');
    btn.innerHTML = '<span class="seed-emoji">'+seed.emoji+'</span><span class="seed-name">'+seed.name+'</span><span class="seed-cost">💰'+seed.cost+'</span><span class="seed-time">⏱'+seed.growTime+'s</span>';
    if (!locked) btn.onclick = function() { selectSeed(seed.id); };
    row.appendChild(btn);
  });
}

function selectSeed(id) {
  state.selectedSeed = (state.selectedSeed===id) ? null : id;
  renderSeeds();
}

function plantSeed(plotIdx) {
  if (!state.selectedSeed) { toast('Sélectionne une graine !','error'); return; }
  var seed = SEEDS.find(function(s){ return s.id===state.selectedSeed; });
  if (!seed) return;
  if (state.gold < seed.cost) { toast('Pas assez d\'or !','error'); return; }
  state.gold -= seed.cost;
  state.plots[plotIdx].crop = seed;
  state.plots[plotIdx].plantedAt = state.tick;
  state.plots[plotIdx].growTime = seed.growTime;
  state.plots[plotIdx].status = 'growing';
  updateHUD(); renderFarm();
}

function harvest(plotIdx, el) {
  var plot = state.plots[plotIdx];
  if (!plot.crop || plot.status!=='ready') return;
  var crop = plot.crop;
  state.inventory[crop.id] = (state.inventory[crop.id]||0)+1;
  var gold = crop.sell;
  state.gold += gold;
  state.plots[plotIdx] = {id:plotIdx,locked:false,crop:null,plantedAt:null,growTime:null,status:null};
  updateHUD(); renderFarm(); checkFarmNotif();
  var rect = el.getBoundingClientRect();
  spawnFloat('+💰'+gold, rect.left+rect.width/2, rect.top, 'harvest-float');
  toast(crop.emoji+' Récolte ! +'+gold+' or','gold');
}

// ══════════════════════════════════════════
function renderRecipes() {
  var area = document.getElementById('recipesArea');
  var available = RECIPES.filter(function(r){ return r.unlockDay<=state.day; });
  var locked = RECIPES.filter(function(r){ return r.unlockDay>state.day; });
  var html = '<div><div class="recipe-section-title">👨‍🍳 Recettes disponibles</div>';
  available.forEach(function(r) {
    var canCook = canCookRecipe(r);
    var ingsHtml = '';
    Object.entries(r.ingredients).forEach(function(entry) {
      var id=entry[0], qty=entry[1];
      var seed = SEEDS.find(function(s){ return s.id===id; });
      var have = (state.inventory[id]||0)>=qty;
      ingsHtml += '<span class="recipe-ing '+(have?'have':'missing')+'">'+(seed?seed.emoji:'?')+'×'+qty+' '+(have?'✓':'✗')+'</span>';
    });
    html += '<div class="recipe-card" onclick="cookRecipe(\''+r.id+'\')"><div class="recipe-card-top"><span class="recipe-emoji">'+r.emoji+'</span>'
      +'<div class="recipe-info"><div class="recipe-name">'+r.name+'</div><div class="recipe-desc">'+r.desc+'</div></div></div>'
      +'<div class="recipe-ingredients">'+ingsHtml
      +'<button class="btn-cook" '+(canCook?'':'disabled')+'>🍳 Cuisiner</button></div></div>';
  });
  if (locked.length>0) {
    html += '<div class="recipe-section-title" style="margin-top:0.5rem">🔒 Non débloquées</div>';
    locked.forEach(function(r) {
      html += '<div class="recipe-card locked-recipe"><div class="recipe-card-top"><span class="recipe-emoji" style="filter:grayscale(1)">🔒</span>'
        +'<div class="recipe-info"><div class="recipe-name">'+r.name+'</div><div class="recipe-desc">Débloque au Jour '+r.unlockDay+'</div></div></div></div>';
    });
  }
  html += '</div>';
  area.innerHTML = html;
}

function canCookRecipe(recipe) {
  return Object.entries(recipe.ingredients).every(function(entry){ return (state.inventory[entry[0]]||0)>=entry[1]; });
}

function cookRecipe(recipeId) {
  var recipe = RECIPES.find(function(r){ return r.id===recipeId; });
  if (!recipe) return;
  if (!canCookRecipe(recipe)) { toast('Ingrédients manquants !','error'); return; }
  Object.entries(recipe.ingredients).forEach(function(entry){ state.inventory[entry[0]]-=entry[1]; });
  state.cooked[recipe.id] = (state.cooked[recipe.id]||0)+1;
  toast(recipe.emoji+' '+recipe.name+' cuisiné !','success');
  var area = document.getElementById('recipesArea');
  var rect = area.getBoundingClientRect();
  spawnFloat(recipe.emoji, rect.left+rect.width/2, rect.top+60, 'cook-float');
  renderRecipes(); updateHUD();
}

function useCookedDish(recipeId) {
  var recipe = RECIPES.find(function(r){ return r.id===recipeId; });
  if (!recipe || !state.cooked[recipeId]) return;
  state.cooked[recipeId]--;
  applyRecipeEffect(recipe);
  toast(recipe.emoji+' '+recipe.name+' utilisé !','success');
  closeModal();
  if (state.fightState==='active') { updateFightBars(); renderFightActive(document.getElementById('fightArea')); }
  updateHUD();
}

function applyRecipeEffect(recipe) {
  var e = recipe.effects;
  if (e.heal)       { state.player.hp = Math.min(state.player.maxHp, state.player.hp+e.heal); }
  if (e.rageMax)    { state.player.rage = state.player.maxRage; }
  if (e.atkPerm)    { state.player.atk += e.atkPerm; }
  if (e.maxHpBonus) { state.player.maxHp += e.maxHpBonus; state.player.hp += e.maxHpBonus; }
  if (e.atkBuff && e.buffRounds) {
    state.buffs.atk = (state.buffs.atk||0)+e.atkBuff;
    state.buffs.rounds = Math.max(state.buffs.rounds||0, e.buffRounds);
  }
  if (e.defBuff && e.buffRounds) {
    state.buffs.def = (state.buffs.def||0)+e.defBuff;
    state.buffs.rounds = Math.max(state.buffs.rounds||0, e.buffRounds);
  }
  if (e.nextCrit) { state.buffs.nextCrit = true; }
  updateHUD();
}

// ══════════════════════════════════════════
//  FIGHT LOGIC
// ══════════════════════════════════════════
function startFightWith(enemyId) {
  state.currentEnemy = JSON.parse(JSON.stringify(ENEMIES.find(function(e){ return e.id===enemyId; })));
  state.enemyHp = state.currentEnemy.hp;
  state.fightState = 'intro';
  state.enemyPatternIdx = 0;
  state.enemySpecialUsed = {};
  state.combatLog = [];
  renderFight();
}

function beginFight() {
  state.fightState = 'active';
  state.buffs = {atk:0,def:0,rounds:0,nextCrit:false};
  state.debuffs = {atk:0,def:0,rounds:0,blind:0,burn:0,poison:0,stun:0};
  state.enemyDebuffs = {def:0,rounds:0,burn:0,poison:0};
  state.defending = false;
  state.combatLog = [{type:'sys',text:'Combat contre '+state.currentEnemy.name+' !'}];
  renderFight();
}

function addLog(text, type) {
  state.combatLog.push({text:text, type:type||'atk'});
  if (state.combatLog.length > 6) state.combatLog.shift();
}

function playerAttack(moveId) {
  var move = MOVES.find(function(m){ return m.id===moveId; });
  var p = state.player;
  var e = state.currentEnemy;

  if (state.debuffs.stun > 0) {
    state.debuffs.stun--;
    addLog('Tu es étourdi(e) ! Tour perdu.', 'hurt');
    updateFightDisplay();
    setTimeout(function(){ enemyTurn(); }, 500);
    return;
  }

  if (move.rageCost>0 && p.rage<move.rageCost) { toast('Pas assez de Rage !','error'); return; }

  state.defending = (move.id==='defend');

  document.querySelectorAll('.move-btn').forEach(function(b){ b.disabled=true; });

  if (move.id==='defend') {
    addLog('Tu prends une position défensive !', 'sys');
    p.rage = Math.min(p.maxRage, p.rage+move.ragegen);
    updateFightDisplay();
    setTimeout(function(){ enemyTurn(); }, 300);
    return;
  }
  if (move.id==='taunt') {
    addLog('Tu provoques l\'adversaire ! +'+move.ragegen+' Rage', 'sys');
    p.rage = Math.min(p.maxRage, p.rage+move.ragegen);
    updateFightDisplay();
    setTimeout(function(){ enemyTurn(); }, 300);
    return;
  }

  // Hit or miss
  var accMod = state.debuffs.blind>0 ? 0.65 : 1;
  var hitRoll = Math.random();
  if (hitRoll > move.acc * accMod) {
    addLog('Raté ! '+e.name+' esquive ton '+move.label, 'sys');
    if (state.debuffs.blind>0) state.debuffs.blind--;
    p.rage = Math.min(p.maxRage, p.rage+Math.floor(move.ragegen*0.4));
    updateFightDisplay();
    var oppEl = document.getElementById('opponentEmoji');
    if (oppEl) { oppEl.classList.remove('dodge'); void oppEl.offsetWidth; oppEl.classList.add('dodge'); }
    setTimeout(function(){ enemyTurn(); }, 500);
    return;
  }

  var buffAtk = (state.buffs.rounds>0) ? state.buffs.atk : 0;
  var debuffAtk = (state.debuffs.rounds>0) ? state.debuffs.atk : 0;
  var totalAtk = Math.max(1, p.atk + buffAtk - debuffAtk);
  var enemyDef = Math.max(0, (e.def) - (state.enemyDebuffs.def||0));
  var baseDmg = totalAtk * move.dmgMult;
  var variance = Math.random()*0.35+0.83;
  var dmg = Math.max(1, Math.round(baseDmg*variance) - Math.floor(enemyDef*0.7));
  var isCrit = state.buffs.nextCrit || (Math.random() < 0.10+(p.spd*0.003));
  if (isCrit) { dmg = Math.round(dmg*2.1); state.buffs.nextCrit=false; }
  if (move.rageCost>0) p.rage = Math.max(0, p.rage - move.rageCost);
  p.rage = Math.min(p.maxRage, p.rage+move.ragegen);

  state.enemyHp = Math.max(0, state.enemyHp-dmg);

  // Animations
  var oppEl = document.getElementById('opponentEmoji');
  var plEl = document.getElementById('playerEmoji');
  if (plEl) { plEl.classList.remove('attack-anim'); void plEl.offsetWidth; plEl.classList.add('attack-anim'); }
  setTimeout(function(){
    if (oppEl) { oppEl.classList.remove('hit'); void oppEl.offsetWidth; oppEl.classList.add('hit'); }
  }, 80);

  var rect = oppEl ? oppEl.getBoundingClientRect() : {left:200,top:200,width:80};
  if (isCrit) {
    spawnDmgNumber('💥'+dmg, rect.left+rect.width/2, rect.top, 'crit-dmg');
    addLog('CRITIQUE ! '+move.emoji+' '+dmg+' dégâts avec '+move.label+' !', 'crit');
  } else {
    spawnDmgNumber(dmg, rect.left+rect.width/2, rect.top, 'enemy-dmg');
    addLog(move.emoji+' '+dmg+' dégâts avec '+move.label, 'atk');
  }

  if (state.debuffs.blind>0) state.debuffs.blind--;
  if (state.buffs.rounds>0) state.buffs.rounds--;

  // Enemy DoT
  if (state.enemyDebuffs.burn>0) {
    var burnDmg = 6;
    state.enemyHp = Math.max(0, state.enemyHp-burnDmg);
    state.enemyDebuffs.burn--;
    addLog('🔥 Brûlure sur '+e.name+' : −'+burnDmg+' HP', 'atk');
  }

  updateFightDisplay();

  if (state.enemyHp<=0) {
    state.enemyHp=0;
    setTimeout(function(){ endFight(true); }, 600);
    return;
  }
  setTimeout(function(){ enemyTurn(); }, 550);
}

function enemyTurn() {
  if (state.fightState!=='active') return;
  var p = state.player;
  var e = state.currentEnemy;

  // Player DoT
  if (state.debuffs.burn>0) {
    var bd = 5;
    p.hp = Math.max(0, p.hp-bd);
    state.debuffs.burn--;
    addLog('🔥 Brûlure : −'+bd+' HP', 'hurt');
    updateHUD();
  }
  if (state.debuffs.poison>0) {
    var pd = 8;
    p.hp = Math.max(0, p.hp-pd);
    state.debuffs.poison--;
    addLog('☠️ Poison : −'+pd+' HP', 'hurt');
    updateHUD();
  }
  if (p.hp<=0) { endFight(false); return; }

  // Enemy special?
  var usesSpecial = false;
  if (e.special && !state.enemySpecialUsed[e.id+'_special'] && Math.random()<e.special.chance) {
    usesSpecial = true;
    if (e.special.effect==='defDebuff') {
      state.debuffs.def += 5; state.debuffs.rounds = Math.max(state.debuffs.rounds,3);
      addLog('💫 '+e.special.name+' ! Ta DEF réduite de 5 pendant 3 tours.', 'hurt');
    } else if (e.special.effect==='doubleHit') {
      var d1 = calcEnemyDmg(e);
      p.hp = Math.max(0, p.hp-d1);
      var d2 = calcEnemyDmg(e);
      p.hp = Math.max(0, p.hp-d2);
      addLog('⚡ '+e.special.name+' ! Double frappe : −'+d1+' et −'+d2+' HP !', 'hurt');
      spawnPlayerHitFX(d1+d2);
    } else if (e.special.effect==='burn') {
      state.debuffs.burn = 3;
      addLog('🔥 '+e.special.name+' ! Tu brûles pendant 3 tours.', 'hurt');
    } else if (e.special.effect==='stun') {
      if (Math.random()<0.5) {
        state.debuffs.stun = 1;
        addLog('⚡ '+e.special.name+' ! Tu es étourdi(e) un tour !', 'hurt');
      } else {
        addLog('✦ '+e.special.name+' — Tu résistes à l\'étourdissement !', 'sys');
      }
    } else if (e.special.effect==='armorPierce') {
      var apDmg = Math.round((e.atk[0]+Math.random()*(e.atk[1]-e.atk[0]))*1.5);
      p.hp = Math.max(0, p.hp-apDmg);
      addLog('🧀 '+e.special.name+' ! Ignore la DEF — −'+apDmg+' HP !', 'hurt');
      spawnPlayerHitFX(apDmg);
    } else if (e.special.effect==='selfHeal' && !state.enemySpecialUsed[e.id+'_heal']) {
      var healAmt = 25;
      state.enemyHp = Math.min(e.hp, state.enemyHp+healAmt);
      state.enemySpecialUsed[e.id+'_heal'] = true;
      addLog('💚 '+e.special.name+' ! '+e.name+' se soigne de '+healAmt+' HP !', 'sys');
    } else if (e.special.effect==='burnAndDebuff') {
      state.debuffs.burn=4; state.debuffs.atk=8; state.debuffs.rounds=4;
      addLog('🍜 '+e.special.name+' ! Brûlure 4 tours + ATK −8 pendant 4 tours.', 'hurt');
    } else if (e.special.effect==='blindAndBurn') {
      state.debuffs.blind=2; state.debuffs.burn=3;
      addLog('🌶️ '+e.special.name+' ! Aveugle 2 tours + brûlure 3 tours !', 'hurt');
    } else if (e.special.effect==='pierceHeavy') {
      var phDmg = Math.round((e.atk[0]+Math.random()*(e.atk[1]-e.atk[0]))*2.2);
      p.hp = Math.max(0, p.hp-phDmg);
      addLog('🌮 '+e.special.name+' ! −'+phDmg+' HP (ignore la DEF) !', 'hurt');
      spawnPlayerHitFX(phDmg);
    } else if (e.special.effect==='poisonAndStun') {
      state.debuffs.poison=4;
      if (Math.random()<0.4) state.debuffs.stun=1;
      addLog('🍩 '+e.special.name+' ! Poison 4 tours'+(state.debuffs.stun>0?' + étourdi !':'')+'', 'hurt');
    } else if (e.special.effect==='statsNuke') {
      state.debuffs.atk=Math.round(p.atk*0.1); state.debuffs.def=Math.round(p.def*0.1);
      state.debuffs.rounds=4;
      addLog('🍱 '+e.special.name+' ! Tous tes stats réduits 4 tours !', 'hurt');
    } else {
      usesSpecial = false;
    }
    state.enemySpecialUsed[e.id+'_special'] = true;
  }

  if (!usesSpecial) {
    // Pattern attack
    var pattern = e.pattern || ['jab','cross'];
    var patternMove = pattern[state.enemyPatternIdx % pattern.length];
    state.enemyPatternIdx = (state.enemyPatternIdx+1) % pattern.length;
    var dmg = calcEnemyDmg(e);
    var defMult = state.defending ? 0.38 : 1;
    var buffDefVal = (state.buffs.rounds>0) ? state.buffs.def : 0;
    var extraDef = (state.debuffs.rounds>0 && state.debuffs.def>0) ? -state.debuffs.def : 0;
    var finalDef = Math.max(0, p.def+buffDefVal+extraDef);
    var finalDmg = Math.max(1, Math.round((dmg - Math.floor(finalDef*0.55)) * defMult));
    p.hp = Math.max(0, p.hp-finalDmg);
    if (state.defending) {
      addLog('🛡️ '+e.emoji+' Attaque bloquée : −'+finalDmg+' HP (défense active)', 'hurt');
    } else {
      addLog(e.emoji+' '+e.name+' frappe avec '+patternMove+' : −'+finalDmg+' HP', 'hurt');
    }
    spawnPlayerHitFX(finalDmg);
  }

  state.defending = false;
  updateHUD();
  updateFightDisplay();

  document.querySelectorAll('.move-btn').forEach(function(b){
    var cls = b.className;
    var m = MOVES.find(function(mv){ return cls.indexOf(mv.class)!==-1; });
    b.disabled = !!(m && m.rageCost>0 && p.rage<m.rageCost);
  });

  if (p.hp<=0) { p.hp=0; endFight(false); }
}

function calcEnemyDmg(e) {
  return e.atk[0]+Math.floor(Math.random()*(e.atk[1]-e.atk[0]+1));
}

function spawnPlayerHitFX(dmg) {
  var plEl = document.getElementById('playerEmoji');
  if (plEl) { plEl.classList.remove('hit'); void plEl.offsetWidth; plEl.classList.add('hit'); }
  var rect = plEl ? plEl.getBoundingClientRect() : {left:80,top:200,width:60};
  spawnDmgNumber('-'+dmg, rect.left+rect.width/2, rect.top, 'player-dmg');
}

function updateFightDisplay() {
  // Update bars without full re-render
  var e = state.currentEnemy;
  var p = state.player;
  if (!e) return;
  var eb = document.getElementById('enemyHpBar');
  var pb = document.getElementById('playerHpBar');
  var ev = document.getElementById('enemyHpVal');
  var pv = document.getElementById('playerHpVal');
  var rb = document.getElementById('rageBar');
  var rv = document.getElementById('rageVal');
  if (eb) eb.style.width = Math.max(0,(state.enemyHp/e.hp)*100)+'%';
  if (pb) pb.style.width = Math.max(0,(p.hp/p.maxHp)*100)+'%';
  if (ev) ev.textContent = Math.max(0,state.enemyHp)+'/'+e.hp;
  if (pv) pv.textContent = p.hp+'/'+p.maxHp;
  if (rb) rb.style.width = (p.rage/p.maxRage*100)+'%';
  if (rv) rv.textContent = p.rage;

  // Update log
  var logEl = document.querySelector('.rpg-battle-log');
  if (logEl) {
    logEl.innerHTML = state.combatLog.slice(-2).map(function(l){
      return '<div class="rpg-log-line '+l.type+'">'+l.text+'</div>';
    }).join('');
  }

  // Update buffs
  var buffRow = document.querySelector('.rpg-buffs-row');
  if (buffRow) {
    var buffHtml = '';
    if (state.buffs.rounds>0) {
      if (state.buffs.atk>0) buffHtml += '<span class="buff-pill">+'+state.buffs.atk+' ATK ('+state.buffs.rounds+')</span>';
      if (state.buffs.def>0) buffHtml += '<span class="buff-pill def">+'+state.buffs.def+' DEF ('+state.buffs.rounds+')</span>';
    }
    if (state.buffs.nextCrit) buffHtml += '<span class="buff-pill crit">💥 CRIT</span>';
    if (state.debuffs.burn>0) buffHtml += '<span class="buff-pill" style="border-color:#e67e22;color:#e67e22">🔥 BRÛL.('+state.debuffs.burn+')</span>';
    if (state.debuffs.poison>0) buffHtml += '<span class="buff-pill poison">☠️ POISON('+state.debuffs.poison+')</span>';
    if (state.debuffs.blind>0) buffHtml += '<span class="buff-pill stun">👁️‍🗨️ AVEUGLE('+state.debuffs.blind+')</span>';
    if (state.debuffs.stun>0) buffHtml += '<span class="buff-pill stun">⚡ STUN('+state.debuffs.stun+')</span>';
    buffRow.innerHTML = buffHtml;
  }
}

// Alias for backward compat
function updateFightBars() { updateFightDisplay(); }

function endFight(won) {
  var e = state.currentEnemy;
  state.buffs = {atk:0,def:0,rounds:0,nextCrit:false};
  state.debuffs = {atk:0,def:0,rounds:0,blind:0,burn:0,poison:0,stun:0};
  state.enemyDebuffs = {def:0,rounds:0,burn:0,poison:0};
  state.defending = false;
  if (won) {
    state.gold += e.reward.gold;
    state.player.streak++;
    state.wins++;
    gainXP(e.reward.xp);
    state.fightState = 'victory';
  } else {
    state.player.streak = 0;
    state.fightState = 'defeat';
  }
  updateHUD(); renderFight(); saveGame();
}

function afterVictory() {
  state.player.hp = Math.min(state.player.maxHp, state.player.hp+20);
  state.player.rage = 0;
  state.fightState = 'select';
  updateHUD(); renderFight();
}
function afterDefeat() {
  state.player.hp = Math.min(state.player.maxHp, Math.round(state.player.maxHp*0.35));
  state.player.rage = 0;
  state.fightState = 'select';
  updateHUD(); renderFight();
}

function fleeFight() {
  var penalty = Math.round(state.player.maxHp*0.12);
  state.player.hp = Math.max(1, state.player.hp-penalty);
  state.player.streak = 0;
  state.player.rage = 0;
  state.buffs = {atk:0,def:0,rounds:0,nextCrit:false};
  state.debuffs = {atk:0,def:0,rounds:0,blind:0,burn:0,poison:0,stun:0};
  state.defending = false;
  state.fightState = 'select';
  updateHUD(); renderFight();
  toast('Tu as fui... (−'+penalty+' HP)','error');
}

function openFoodModal() {
  var seedItems = SEEDS.filter(function(s){ return (state.inventory[s.id]||0)>0; });
  var cookedItems = RECIPES.filter(function(r){ return (state.cooked[r.id]||0)>0; });
  var shopItems = SHOP_ITEMS.filter(function(s){ return (state.inventory[s.id]||0)>0 && s.type==='item'; });

  var html = '<div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.5rem">';
  if (cookedItems.length>0) {
    html += '<div style="font-family:\'Oswald\',sans-serif;font-size:0.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);margin-bottom:0.2rem">👨‍🍳 Plats cuisinés</div>';
    cookedItems.forEach(function(r){
      html += '<button onclick="useCookedDish(\''+r.id+\')" style="background:var(--surface2);border:1px solid var(--yellow);color:var(--text);border-radius:8px;padding:0.7rem;font-family:\'DM Sans\',sans-serif;font-size:0.82rem;display:flex;align-items:center;gap:0.7rem;cursor:pointer;width:100%;text-align:left">'
        +'<span style="font-size:1.6rem">'+r.emoji+'</span>'
        +'<div style="flex:1"><div style="font-weight:500">'+r.name+' <span style="color:var(--yellow);font-size:0.65rem">(×'+state.cooked[r.id]+')</span></div>'
        +'<div style="font-size:0.6rem;color:var(--muted)">'+r.desc+'</div></div>'
        +'</button>';
    });
  }
  if (seedItems.length>0) {
    html += '<div style="font-family:\'Oswald\',sans-serif;font-size:0.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0.4rem 0 0.2rem">🌱 Ingrédients bruts</div>';
    seedItems.forEach(function(s){
      html += '<button onclick="useRawItem(\''+s.id+\')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0.6rem;font-family:\'DM Sans\',sans-serif;font-size:0.78rem;display:flex;align-items:center;gap:0.6rem;cursor:pointer;width:100%;text-align:left">'
        +'<span style="font-size:1.3rem">'+s.emoji+'</span>'
        +'<span style="flex:1">'+s.name+' ×'+state.inventory[s.id]+'</span>'
        +'<span style="color:var(--green);font-size:0.68rem">'+(s.heal>0?('+'+s.heal+'HP '):'')+(s.atk>0?('+'+s.atk+'ATK'):'')+'</span>'
        +'</button>';
    });
  }
  if (shopItems.length>0) {
    html += '<div style="font-family:\'Oswald\',sans-serif;font-size:0.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0.4rem 0 0.2rem">🧪 Potions</div>';
    shopItems.forEach(function(item){
      html += '<button onclick="useShopItem(\''+item.id+\')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:0.6rem;font-family:\'DM Sans\',sans-serif;font-size:0.78rem;display:flex;align-items:center;gap:0.6rem;cursor:pointer;width:100%;text-align:left">'
        +'<span style="font-size:1.3rem">'+item.emoji+'</span>'
        +'<span style="flex:1">'+item.name+' ×'+state.inventory[item.id]+'</span>'
        +'<span style="color:var(--green);font-size:0.68rem">'+(item.heal?('+'+item.heal+'HP'):'')+' '+(item.rageMax?'Rage MAX':'')+(item.cure?'Soigne status':'')+'</span>'
        +'</button>';
    });
  }
  html += '</div>';
  showModal('🍱 Utiliser un aliment','Choisis ce que tu veux consommer.',html,[{label:'Annuler',action:'closeModal()'}]);
}

function useRawItem(seedId) {
  var seed = SEEDS.find(function(s){ return s.id===seedId; });
  if (!seed || !state.inventory[seedId]) return;
  state.inventory[seedId]--;
  if (seed.heal>0) { state.player.hp=Math.min(state.player.maxHp,state.player.hp+seed.heal); toast(seed.emoji+' +'+seed.heal+' HP !','success'); }
  if (seed.atk>0)  { state.player.atk+=seed.atk; toast(seed.emoji+' +'+seed.atk+' ATK !','success'); }
  closeModal(); updateHUD();
  if (state.fightState==='active') updateFightDisplay();
}

function useShopItem(itemId) {
  var item = SHOP_ITEMS.find(function(i){ return i.id===itemId; });
  if (!item || !state.inventory[itemId]) return;
  state.inventory[itemId]--;
  if (item.heal)    { state.player.hp=Math.min(state.player.maxHp,state.player.hp+item.heal); toast(item.emoji+' +'+item.heal+' HP !','success'); }
  if (item.rageMax) { state.player.rage=state.player.maxRage; toast(item.emoji+' Rage MAX !','success'); }
  if (item.cure)    { state.debuffs.burn=0; state.debuffs.poison=0; state.debuffs.stun=0; toast(item.emoji+' Status guéris !','success'); }
  closeModal(); updateHUD();
  if (state.fightState==='active') updateFightDisplay();
}

function renderShop() {
  var area = document.getElementById('shopArea');
  var equips = SHOP_ITEMS.filter(function(i){ return i.type==='equip'; });
  var items  = SHOP_ITEMS.filter(function(i){ return i.type!=='equip'; });
  var html = '<div><div class="shop-section-title">⚔️ Équipement</div><div class="shop-grid">';
  equips.forEach(function(item) {
    var owned = !!state.equipped[item.id];
    var afford = state.gold>=item.cost;
    var clickAttr = owned ? '' : ('onclick="buyItem(\''+item.id+\')"');
    html += '<div class="shop-item '+(owned?'owned':'')+' '+(!afford&&!owned?'cant-afford':'')+'" '+clickAttr+'>'
      +'<span class="shop-item-emoji">'+item.emoji+'</span>'
      +'<div class="shop-item-name">'+item.name+'</div>'
      +'<div class="shop-item-desc">'+item.desc+'</div>'
      +'<div class="shop-item-price">💰 '+(owned?'Possédé':item.cost)+'</div>'
      +'</div>';
  });
  html += '</div></div><div><div class="shop-section-title">🧪 Consommables</div><div class="shop-grid">';
  items.forEach(function(item) {
    var qty = state.inventory[item.id]||0;
    var afford = state.gold>=item.cost;
    html += '<div class="shop-item '+(!afford?'cant-afford':'')+'" onclick="buyItem(\''+item.id+\')">'
      +'<span class="shop-item-emoji">'+item.emoji+'</span>'
      +'<div class="shop-item-name">'+item.name+(qty>0?' <span style="color:var(--yellow);font-size:0.6rem">(×'+qty+')</span>':'')+'</div>'
      +'<div class="shop-item-desc">'+item.desc+'</div>'
      +'<div class="shop-item-price">💰 '+item.cost+'</div>'
      +'</div>';
  });
  html += '</div></div>';
  area.innerHTML = html;
}

function buyItem(itemId) {
  var item = SHOP_ITEMS.find(function(i){ return i.id===itemId; });
  if (!item) return;
  if (state.gold<item.cost) { toast('Pas assez d\'or !','error'); return; }
  if (item.type==='equip' && state.equipped[item.id]) { toast('Déjà équipé !','error'); return; }
  state.gold -= item.cost;
  if (item.type==='equip') {
    state.equipped[item.id]=true;
    state.player[item.stat]=(state.player[item.stat]||0)+item.val;
    toast(item.emoji+' '+item.name+' équipé !','success');
  } else if (item.type==='plot') {
    var unlocked=0;
    for (var i=0;i<state.plots.length&&unlocked<item.val;i++) {
      if (state.plots[i].locked) { state.plots[i].locked=false; unlocked++; }
    }
    if (unlocked===0) {
      var start=state.plots.length;
      for (var j=0;j<item.val;j++) state.plots.push({id:start+j,locked:false,crop:null,plantedAt:null,growTime:null,status:null});
      toast('🟫 '+item.val+' nouvelles parcelles !','success');
    } else toast('🟫 '+unlocked+' nouvelles parcelles !','success');
    renderFarm();
  } else {
    state.inventory[item.id]=(state.inventory[item.id]||0)+1;
    toast(item.emoji+' Acheté !','success');
  }
  updateHUD(); renderShop();
}
