<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Lunch Boxe — World of Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Raleway:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- TITLE SCREEN -->
<div class="screen active" id="screenTitle">
  <div class="title-scanlines"></div>
  <div class="title-grid"></div>
  <div class="title-frame">
    <div class="title-corner tl"></div><div class="title-corner tr"></div>
    <div class="title-corner bl"></div><div class="title-corner br"></div>
    <span class="title-crest">🥊</span>
    <div class="title-main">LUNCH<span>BOXE</span></div>
    <div class="title-sub">World of Cuisine</div>
    <div class="title-divider"></div>
    <div class="title-tagline">Farm · Cook · Fight · Conquer</div>
    <input class="title-name-input" id="playerNameInput" type="text" maxlength="16" placeholder="Ton nom de guerrier..." autocomplete="off"/>
    <button class="btn-title" onclick="handleStartGame()">⚔ Entrer dans le Monde</button>
    <button class="btn-title secondary" onclick="handleLoadGame()">📜 Charger une Partie</button>
    <a href="index.html" class="btn-title secondary" style="display:block;text-align:center;text-decoration:none;margin-top:0.2rem">← Lunchboxd</a>
    <p class="title-disclaimer">Tes données sont sauvegardées localement.</p>
  </div>
</div>

<!-- MAIN GAME SCREEN -->
<div class="screen" id="screenGame">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">🥊 <span id="playerNameDisplay">Champion</span></div>
    <div class="topbar-sep"></div>
    <div class="topbar-current-tab" id="topbarCurrentTab">🗺️ Monde</div>
    <div class="topbar-skills" id="topbarSkills" style="display:none"></div>
    <div class="topbar-right">
      <div class="topbar-gold" id="topbarGold">💰 0</div>
      <button class="burger-btn" id="burgerBtn" onclick="toggleNavDrawer()" aria-label="Menu navigation">
        <div class="burger-line"></div>
        <div class="burger-line"></div>
        <div class="burger-line"></div>
      </button>
    </div>
  </div>

  <!-- NAV DRAWER -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeNavDrawer()"></div>
  <div class="nav-drawer" id="navDrawer">

    <!-- Navigation grid -->
    <div class="nav-grid">
      <button class="nav-item active" id="navWorld" onclick="switchTab('World');closeNavDrawer()">
        <span class="nav-item-icon">🗺️</span>
        <span class="nav-item-label">Monde</span>
      </button>
      <button class="nav-item" id="navFarm" onclick="switchTab('Farm');closeNavDrawer()">
        <span class="nav-item-icon">🌱</span>
        <span class="nav-item-label">Ferme</span>
      </button>
      <button class="nav-item" id="navCook" onclick="switchTab('Cook');closeNavDrawer()">
        <span class="nav-item-icon">🍳</span>
        <span class="nav-item-label">Cuisine</span>
      </button>
      <button class="nav-item" id="navFight" onclick="switchTab('Fight');closeNavDrawer()">
        <span class="nav-item-icon">⚔️</span>
        <span class="nav-item-label">Combat</span>
      </button>
      <button class="nav-item" id="navQuests" onclick="switchTab('Quests');closeNavDrawer()">
        <span class="nav-item-icon">📜</span>
        <span class="nav-item-label">Quêtes</span>
      </button>
      <button class="nav-item" id="navShop" onclick="switchTab('Shop');closeNavDrawer()">
        <span class="nav-item-icon">🏪</span>
        <span class="nav-item-label">Marché</span>
      </button>
      <button class="nav-item" id="navInv" onclick="switchTab('Inv');closeNavDrawer()">
        <span class="nav-item-icon">🎒</span>
        <span class="nav-item-label">Sac</span>
      </button>
      <button class="nav-item" onclick="switchTab('Inv');closeNavDrawer()">
        <span class="nav-item-icon">📊</span>
        <span class="nav-item-label">Stats</span>
      </button>
    </div>
  </div>

  <!-- GAME BODY -->
  <div class="game-body">
    <div class="content-area">
      <div class="tab-panel active" id="panelWorld"></div>
      <div class="tab-panel" id="panelFarm"></div>
      <div class="tab-panel" id="panelCook"></div>
      <div class="tab-panel" id="panelFight"></div>
      <div class="tab-panel" id="panelQuests"></div>
      <div class="tab-panel" id="panelShop"></div>
      <div class="tab-panel" id="panelInv"></div>
      <div class="chat-log" id="chatLog">
        <div class="chat-line sys">Bienvenue dans Lunch Boxe: World of Cuisine.</div>
      </div>
    </div>
    <div class="sidebar" id="mainSidebar">
      <div class="minimap-wrap">
        <div class="minimap" id="minimap"></div>
        <div class="minimap-label" id="minimapLabel">Carte</div>
      </div>
      <div class="skills-grid" id="sidebarSkills"></div>
    </div>
  </div>
</div>

<!-- NARRATOR -->
<div class="narrator-overlay" id="narratorOverlay" onclick="narratorTap()">
  <div class="narrator-box" onclick="e=>e.stopPropagation()">
    <div class="narrator-portrait">
      <div class="char-sprite" id="narratorSprite"></div>
      <div class="char-name-tag fraise" id="narratorNameTag">Fraise</div>
    </div>
    <div class="narrator-content">
      <div class="narrator-text" id="narratorText"></div>
      <div class="narrator-footer">
        <div class="narrator-dots" id="narratorDots"></div>
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <button class="btn-narrator-skip" onclick="skipNarrator()">Passer</button>
          <button class="btn-narrator-next" id="narratorNextBtn" onclick="narratorNext()">Suivant ▶</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- LOOTBOX OPENING OVERLAY -->
<div class="lb-opening-overlay" id="lbOpeningOverlay">
  <span class="lb-box-anim" id="lbBoxAnim">📦</span>
  <div class="lb-opening-title" id="lbOpeningTitle">Ouverture...</div>
  <div class="lb-opening-sub" id="lbOpeningSub">Voyons ce que tu as obtenu !</div>
  <div class="lb-rewards-grid" id="lbRewardsGrid"></div>
  <button class="btn-lb-collect" onclick="collectLootbox()">Récupérer !</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="onModalBgClick(event)">
  <div class="modal-box">
    <div class="modal-title-rs" id="modalTitle"></div>
    <div class="modal-desc-rs" id="modalDesc"></div>
    <div id="modalExtra"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- LEVEL UP -->
<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-box">
    <span class="lu-skill-icon" id="luIcon">⭐</span>
    <div class="lu-title" id="luTitle">NIVEAU 2 !</div>
    <div class="lu-sub" id="luSub">Tu as progressé !</div>
    <div class="lu-bonuses" id="luBonuses"></div>
    <button class="btn-lu-ok" onclick="closeLevelUp()">Continuer</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
